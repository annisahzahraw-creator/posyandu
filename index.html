    // =========================================================================

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');

        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 transform translate-y-0 opacity-100`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function formatTanggalIndoFull(dateStr) {
      if (!dateStr) return '';
      const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const tgl = parseInt(parts[2], 10);
      return `${tgl < 10 ? '0' + tgl : tgl} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    // Klasifikasi Otomatis Sasaran: BADUTA (< 24 bln), BALITA (24-59 bln), BUMIL_BUSUI, LANSIA
    function getKlasifikasiPeserta(p, tglRefStr = null) {
      const jenis = p?.jenisSasaran || 'Anak';
      const usiaBln = hitungUsiaBulan(p?.tanggalLahir, tglRefStr);
      const usiaThn = Math.floor(usiaBln / 12);

      if (jenis === 'Ibu Hamil') {
        return {
          kode: 'BUMIL_BUSUI',
          label: 'Ibu Hamil (Bumil)',
          usiaText: `${usiaThn} Thn`,
          badgeClass: 'bg-pink-100 text-pink-800 border-pink-200'
        };
      }
      if (jenis === 'Ibu Menyusui') {
        return {
          kode: 'BUMIL_BUSUI',
          label: 'Ibu Menyusui (Busui)',
          usiaText: `${usiaThn} Thn`,
          badgeClass: 'bg-purple-100 text-purple-800 border-purple-200'
        };
      }
      if (jenis === 'Lansia' || usiaThn >= 60) {
        return {
          kode: 'LANSIA',
          label: 'Lansia',
          usiaText: `${usiaThn} Thn`,
          badgeClass: 'bg-amber-100 text-amber-800 border-amber-200'
        };
      }
      if (usiaBln < 24) {
        return {
          kode: 'BADUTA',
          label: 'Baduta (<2 Thn)',
          usiaText: `${usiaBln} Bln`,
          badgeClass: 'bg-sky-100 text-sky-800 border-sky-200'
        };
      }
      return {
        kode: 'BALITA',
        label: 'Balita (2-5 Thn)',
        usiaText: `${usiaBln} Bln`,
        badgeClass: 'bg-indigo-100 text-indigo-800 border-indigo-200'
      };
    }

    async function handleUserLogin(nik, pin) {
      const cleanNik = nik.trim();
      const cleanPin = pin.trim();

      if (!cleanNik || !cleanPin) {
        showToast('NIK Peserta dan PIN wajib diisi.', 'error');
        return;
      }

      if (IS_PREVIEW) {
        const found = appState.pesertaList.find(p => p.nik === cleanNik && p.pin === cleanPin);
        if (found) {
          if (found.statusAktif === 'Non-Aktif') {
            showToast('Status kepesertaan Anda Non-Aktif. Silakan hubungi Kader Posyandu.', 'error');
            return;
          }
          appState.role = 'user';
          appState.currentUser = found;
          appState.activeTab = 'beranda';
          showToast(`Selamat datang, ${found.namaAnak}!`, 'success');
          renderApp();
        } else {
          showToast('NIK atau PIN peserta tidak ditemukan dalam data demo.', 'error');
        }
        return;
      }

      if (!db) {
        showToast('Koneksi database Firestore belum tersedia.', 'error');
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const q = query(
          collection(db, 'peserta'),
          where('nik', '==', cleanNik),
          where('pin', '==', cleanPin)
        );
        const snap = await getDocs(q);
        appState.loading = false;

        if (snap.empty) {
          showToast('NIK Peserta atau PIN tidak sesuai. Hubungi Kader Posyandu Nusa Indah XX.', 'error');
          renderApp();
          return;
        }

        const docPeserta = snap.docs[0];
        const userData = { id: docPeserta.id, ...docPeserta.data() };
        if (userData.statusAktif === 'Non-Aktif') {
          showToast('Status kepesertaan Anda saat ini Non-Aktif. Silakan hubungi Kader Posyandu.', 'error');
          renderApp();
          return;
        }
        appState.role = 'user';
        appState.currentUser = userData;
        appState.activeTab = 'beranda';
        startUserRealtimeSync(userData.id, userData.nik);
        showToast(`Selamat datang, ${userData.namaAnak}!`, 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Terjadi kesalahan saat memverifikasi akun peserta: ' + err.message, 'error');
        renderApp();
      }
    }

          showToast('Data peserta diperbarui (Mode Preview)', 'success');

      try {
        if (editId) {
          await updateDoc(doc(db, 'peserta', editId), data);
          showToast('Data peserta berhasil diperbarui.', 'success');

          await addDoc(collection(db, 'peserta'), {

    function initSuratTugasCanvas() {
      const canvas = document.getElementById('st-signature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      const getCoords = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDraw = (e) => {
        e.preventDefault();
        isDrawing = true;
        const pos = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#002060';
      };

      const moveDraw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getCoords(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (isDrawing) {
          isDrawing = false;
          ctx.closePath();
        }
      };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);

      document.getElementById('btn-st-clear-sig')?.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        appState.suratTugas.signatureDataUrl = '';
        const img = document.getElementById('st-view-sig-img');
        if (img) {
          img.src = '';
          img.style.display = 'none';
        }
      });

      document.getElementById('btn-st-apply-sig')?.addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        appState.suratTugas.signatureDataUrl = dataUrl;
        const img = document.getElementById('st-view-sig-img');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang ke surat.', 'success');
      });
    }

    function downloadSuratTugasWord() {
      const paperEl = document.getElementById('paperDoc');
      if (!paperEl) return;
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Surat Tugas</title><style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;}table{border-collapse:collapse;width:100%;}</style></head><body>";
      const footer = "</body></html>";
      const fullDoc = header + paperEl.innerHTML + footer;

      const blob = new Blob(['\ufeff' + fullDoc], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      const safeName = (appState.suratTugas.namaPosyandu || 'Posyandu').replace(/\s+/g, '_');
      link.download = `Surat_Tugas_${safeName}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('File DOCX Surat Tugas berhasil diunduh.', 'success');
    }

      const labels = riwayat.map(r => `${formatTanggalIndo(r.tanggalPeriksa)}`);

        type: 'line',

              borderColor: '#0d9488',

    function initReportSignatureCanvas() {
      const canvas = document.getElementById('rep-signature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      const getCoords = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      };

      const startDraw = (e) => {
        e.preventDefault();
        isDrawing = true;
        const pos = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#002060';
      };

      const moveDraw = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getCoords(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (isDrawing) {
          isDrawing = false;
          ctx.closePath();
        }
      };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);

      document.getElementById('btn-rep-clear-sig')?.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        appState.reportSignatureDataUrl = '';
        const img = document.getElementById('rep-view-sig-img');
        if (img) {
          img.src = '';
          img.style.display = 'none';
        }
      });

      document.getElementById('btn-rep-apply-sig')?.addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        appState.reportSignatureDataUrl = dataUrl;
        const img = document.getElementById('rep-view-sig-img');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang ke laporan.', 'success');
      });
    }

    // =========================================================================
    // MAIN RENDERER & EVENT BINDING
    // =========================================================================
    function renderApp() {
      const mount = document.getElementById('app-mount');

      if (!appState.role) {
        mount.innerHTML = renderLoginScreen();
        bindLoginEvents();
        return;
      }

      let mainContent = '';
      if (appState.role === 'admin') {
        if (appState.activeTab === 'dashboard') mainContent = renderAdminDashboard();
        else if (appState.activeTab === 'peserta') mainContent = renderAdminPeserta();
        else if (appState.activeTab === 'pemeriksaan') mainContent = renderAdminPemeriksaan();
        else if (appState.activeTab === 'mbg') mainContent = renderAdminMBG();
        else if (appState.activeTab === 'kader') mainContent = renderAdminKader();
        else if (appState.activeTab === 'surattugas') mainContent = renderAdminSuratTugas();
        else if (appState.activeTab === 'laporan') mainContent = renderAdminLaporan();
        else if (appState.activeTab === 'jadwal') mainContent = renderAdminJadwal();
      } else {
        if (appState.activeTab === 'beranda') mainContent = renderUserBeranda();
        else if (appState.activeTab === 'kms') mainContent = renderUserKMS();
      }

      mount.innerHTML = `
        <div class="min-h-screen bg-slate-50/70">
          ${renderNavigation()}

          <main class="main-content-area px-4 sm:px-8 pt-6 max-w-6xl">
            ${IS_PREVIEW ? `
              <div class="no-print mb-5 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 text-xs text-amber-900">
                <span><strong>Mode Preview Aktif:</strong> Perubahan data hanya tersimpan sementara di memori browser.</span>
                <span class="px-2 py-0.5 rounded bg-amber-500 text-white font-bold shrink-0">PREVIEW</span>
              </div>
            ` : ''}

            ${mainContent}
          </main>
        </div>
      `;

      bindAuthenticatedEvents();

      if (appState.role === 'user' && appState.activeTab === 'kms') {
        initKmsChart();
      }
      if (appState.role === 'admin' && appState.activeTab === 'surattugas') {
        initSuratTugasCanvas();
      }
      if (appState.role === 'admin' && appState.activeTab === 'laporan') {
        initReportSignatureCanvas();
      }
    }

    function bindLoginEvents() {
      document.getElementById('tab-login-user')?.addEventListener('click', () => {
        appState.loginTab = 'user';
        renderApp();
      });

      document.getElementById('tab-login-admin')?.addEventListener('click', () => {
        appState.loginTab = 'admin';
        renderApp();
      });

      document.getElementById('form-login-user')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const nik = document.getElementById('input-user-nik').value;
        const pin = document.getElementById('input-user-pin').value;
        handleUserLogin(nik, pin);
      });

      document.getElementById('form-login-admin')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('input-admin-email').value;
        const pass = document.getElementById('input-admin-pass').value;
        handleAdminLogin(email, pass);
      });
    }

    function bindAuthenticatedEvents() {
      // Navigation buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeTab = btn.getAttribute('data-nav');
          renderApp();
        });
      });

      // Logout buttons
      document.getElementById('btn-logout-desktop')?.addEventListener('click', handleLogout);
      document.getElementById('btn-logout-mobile')?.addEventListener('click', handleLogout);

      // Admin Peserta actions
      document.getElementById('btn-add-peserta')?.addEventListener('click', () => openPesertaFormModal());

      const searchInput = document.getElementById('search-peserta-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          appState.searchQuery = e.target.value;
          renderApp();
          const newInput = document.getElementById('search-peserta-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        });
      }

      document.querySelectorAll('[data-edit-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-peserta');
          const item = appState.pesertaList.find(p => p.id === id);
          if (item) openPesertaFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-peserta');
          confirmDialog('Hapus Data Peserta?', 'Data peserta ini akan dihapus permanen dari daftar.', () => deletePeserta(id));
        });
      });

      document.getElementById('filter-kelompok-select')?.addEventListener('change', (e) => {
        appState.filterKelompok = e.target.value;
        renderApp();
      });

      document.getElementById('filter-mbg-select')?.addEventListener('change', (e) => {
        appState.filterMbg = e.target.value;
        renderApp();
      });

      document.getElementById('filter-status-aktif-select')?.addEventListener('change', (e) => {
        appState.filterStatusAktif = e.target.value;
        renderApp();
      });

      // Admin Kader actions
      document.getElementById('btn-add-kader')?.addEventListener('click', () => openKaderFormModal());

      document.querySelectorAll('[data-edit-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-kader');
          const item = appState.kaderList.find(k => k.id === id);
          if (item) openKaderFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-kader');
          confirmDialog('Hapus Data Kader?', 'Kader ini akan dihapus dari daftar.', () => deleteKader(id));
        });
      });

      // Admin Surat Tugas actions
      document.getElementById('btn-st-pdf')?.addEventListener('click', () => {
        if (window.innerWidth < 1024 && appState.suratTugas.mobileView === 'form') {
          appState.suratTugas.mobileView = 'preview';
          renderApp();
          setTimeout(() => {
            printCleanElement('paperDoc', `Surat_Tugas_${appState.suratTugas.namaPosyandu}`);
          }, 150);
        } else {
          printCleanElement('paperDoc', `Surat_Tugas_${appState.suratTugas.namaPosyandu}`);
        }
      });

      document.getElementById('btn-st-word')?.addEventListener('click', downloadSuratTugasWord);

      document.getElementById('btn-st-tab-form')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'form';
        renderApp();
      });

      document.getElementById('btn-st-tab-preview')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'preview';
        renderApp();
      });

      document.querySelectorAll('.st-input').forEach(inp => {
        const handler = (e) => {
          const field = e.target.getAttribute('data-st-field');
          appState.suratTugas[field] = e.target.value;
          updateSuratTugasLiveDOM();
        };
        inp.addEventListener('input', handler);
        inp.addEventListener('change', handler);
      });

      document.querySelectorAll('.st-kader-input').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const idx = parseInt(e.target.getAttribute('data-st-kader-idx'), 10);
          const key = e.target.getAttribute('data-st-kader-key');
          if (appState.suratTugas.kaderAssigned[idx]) {
            appState.suratTugas.kaderAssigned[idx][key] = e.target.value;
            updateSuratTugasLiveDOM();
          }
        });
      });

      document.getElementById('btn-st-add-kader')?.addEventListener('click', () => {
        const aktifKaderDb = appState.kaderList.filter(k => k.statusAktif !== 'Non-Aktif');
        const defaultKader = aktifKaderDb[0];
        appState.suratTugas.kaderAssigned.push({
          nama: defaultKader ? defaultKader.nama : '',
          jabatan: defaultKader ? (defaultKader.jabatan || 'Kader') : 'Kader'
        });
        renderApp();
      });

      document.querySelectorAll('.st-kader-select').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const idx = parseInt(e.target.getAttribute('data-st-kader-select'), 10);
          const kaderId = e.target.value;
          const found = appState.kaderList.find(k => k.id === kaderId);
          if (appState.suratTugas.kaderAssigned[idx]) {
            if (found) {
              appState.suratTugas.kaderAssigned[idx] = {
                nama: found.nama,
                jabatan: found.jabatan || 'Kader'
              };
            } else if (!kaderId) {
              appState.suratTugas.kaderAssigned[idx] = { nama: '', jabatan: 'Kader' };
            }
            renderApp();
          }
        });
      });

      document.querySelectorAll('[data-st-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-st-del-kader'), 10);
          if (appState.suratTugas.kaderAssigned.length > 1) {
            appState.suratTugas.kaderAssigned.splice(idx, 1);
            renderApp();
          }
        });
      });

      document.getElementById('input-st-logo')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.suratTugas.logoDataUrl = ev.target.result;
          renderApp();
          showToast('Logo kop surat diperbarui.', 'success');
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('btn-st-reset-logo')?.addEventListener('click', () => {
        appState.suratTugas.logoDataUrl = '';
        renderApp();
      });

      document.getElementById('input-st-upload-sig')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.suratTugas.signatureDataUrl = ev.target.result;
          renderApp();
          showToast('Gambar tanda tangan / cap terpasang.', 'success');
        };
        reader.readAsDataURL(file);
      });

      // Admin MBG actions
      document.getElementById('btn-add-mbg')?.addEventListener('click', () => openMBGFormModal());

      document.querySelectorAll('[data-del-mbg]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-mbg');
          confirmDialog('Hapus Catatan MBG?', 'Riwayat penyaluran paket MBG ini akan dihapus.', () => deleteDistribusiMBG(id));
        });
      });

      // Admin Laporan PDF actions
      document.getElementById('btn-trigger-print-pdf')?.addEventListener('click', () => {
        printCleanElement('print-report-area', 'Laporan_Posyandu_Nusa_Indah_XX');
      });

      document.getElementById('select-report-type')?.addEventListener('change', (e) => {
        appState.reportType = e.target.value;
        renderApp();
      });

      document.getElementById('input-report-month')?.addEventListener('change', (e) => {
        appState.reportMonth = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-year')?.addEventListener('change', (e) => {
        appState.reportYear = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-kelompok')?.addEventListener('change', (e) => {
        appState.reportKelompok = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-category')?.addEventListener('change', (e) => {
        appState.reportCategory = e.target.value;
        renderApp();
      });

      document.getElementById('input-report-signer')?.addEventListener('input', (e) => {
        appState.reportPenandatangan = e.target.value;
        const nameEl = document.getElementById('rep-view-signer-name');
        if (nameEl) {
          nameEl.textContent = e.target.value.trim()
            ? `( ${e.target.value.trim()} )`
            : '( ........................................ )';
        }
      });

      document.getElementById('input-rep-upload-sig')?.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.reportSignatureDataUrl = ev.target.result;
          renderApp();
          showToast('Gambar Stamp & TTD terpasang di laporan.', 'success');
        };
        reader.readAsDataURL(file);
      });

      // Admin Pemeriksaan actions
      document.getElementById('btn-add-pemeriksaan')?.addEventListener('click', () => openPemeriksaanFormModal());

      document.querySelectorAll('[data-del-pemeriksaan]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-pemeriksaan');
          confirmDialog('Hapus Catatan Pemeriksaan?', 'Riwayat penimbangan ini akan dihapus.', () => deletePemeriksaan(id));
        });
      });

      // Admin Jadwal actions
      document.getElementById('btn-add-jadwal')?.addEventListener('click', () => openJadwalFormModal());

      document.querySelectorAll('[data-edit-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-jadwal');
          const item = appState.jadwalList.find(j => j.id === id);
          if (item) openJadwalFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-jadwal');
          confirmDialog('Hapus Jadwal?', 'Pengumuman jadwal kegiatan ini akan dihapus.', () => deleteJadwal(id));
        });
      });
    }

    // =========================================================================
    // BOOTSTRAP APLIKASI SAAT HALAMAN DIMUAT
    // =========================================================================
    if (!IS_PREVIEW && auth) {
      onAuthStateChanged(auth, (user) => {
        if (user && appState.role !== 'admin') {
          appState.role = 'admin';
          appState.currentUser = { uid: user.uid, email: user.email };
          appState.activeTab = 'dashboard';
          startAdminRealtimeSync();
        }
        renderApp();
      });
    } else {
      renderApp();
    }
  </script>
</body>
</html>
