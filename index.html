    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button class="text-white/80 hover:text-white font-bold text-lg leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      try {
        const compressedBase64 = await compressGalleryImage(file);
        document.getElementById('editor-isi-artikel').focus();
        document.execCommand('insertImage', false, compressedBase64);
      } catch (err) {
        showToast('Gagal memproses gambar artikel.', 'error');
      }
      input.value = ''; // Reset input

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function formatTanggalSuratFull(dateStr) {
      if (!dateStr) return '';
      const bulanFull = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const tgl = parseInt(parts[2], 10);
      const bln = bulanFull[parseInt(parts[1], 10) - 1] || '';
      return `${tgl < 10 ? '0' + tgl : tgl} ${bln} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    function hitungUsiaTahun(tglLahirStr) {
      return Math.floor(hitungUsiaBulan(tglLahirStr) / 12);
    }

    function getKlasifikasiSasaran(peserta) {
      const kel = peserta.kelompokSasaran || 'ANAK';
      if (kel === 'LANSIA') {
        return { kode: 'LANSIA', label: 'Lansia', badgeClass: 'bg-purple-100 text-purple-800' };
      }
      if (kel === 'BUMIL_BUSUI') {
        return { kode: 'BUMIL_BUSUI', label: 'Ibu Hamil / Menyusui', badgeClass: 'bg-pink-100 text-pink-800' };
      }
      const usiaBln = hitungUsiaBulan(peserta.tanggalLahir);
      if (usiaBln < 24) {
        return { kode: 'BADUTA', label: 'Baduta (< 2 Thn)', badgeClass: 'bg-sky-100 text-sky-800' };
      }
      return { kode: 'BALITA', label: 'Balita (2–5 Thn)', badgeClass: 'bg-indigo-100 text-indigo-800' };
    }

      try {

        renderApp();
        const q = query(

    function compressLogoImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 260;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png', 0.9));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressGalleryImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 800; // Standar optimal resolusi galeri ringan
            let w = img.width; let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderAdminPeserta() {
      const q = appState.searchQuery.toLowerCase();
      const filtered = appState.pesertaList.filter(p => {
        const klas = getKlasifikasiSasaran(p);
        const stAktif = p.statusAktif || 'Aktif';

        const matchQuery =
          (p.namaAnak || '').toLowerCase().includes(q) ||
          (p.nik || '').toLowerCase().includes(q) ||
          (p.namaOrangTua || '').toLowerCase().includes(q);

        const matchSasaran =
          appState.filterSasaran === 'ALL' || klas.kode === appState.filterSasaran;

        const matchStatusAktif =
          appState.filterStatusAktif === 'ALL' || stAktif === appState.filterStatusAktif;

        const matchMbg =
          appState.filterMbg === 'ALL' ||
          (appState.filterMbg === 'YA' && p.penerimaMBG) ||
          (appState.filterMbg === 'TIDAK' && !p.penerimaMBG);

        return matchQuery && matchSasaran && matchStatusAktif && matchMbg;
      });

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Data Peserta Terpadu</h1>

            <select id="filter-sasaran-select" class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium text-slate-700 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-500">

              <option value="BALITA" ${appState.filterSasaran === 'BALITA' ? 'selected' : ''}>Balita (2–5 Tahun / 24–59 Bln)</option>

              <option value="Aktif" ${appState.filterStatusAktif === 'Aktif' ? 'selected' : ''}>Status: Aktif</option>
              <option value="Non-Aktif" ${appState.filterStatusAktif === 'Non-Aktif' ? 'selected' : ''}>Status: Non-Aktif</option>
            </select>

            <select id="filter-mbg-select" class="px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-medium text-slate-700 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-500">

          ${filtered.length === 0 ? `

                  ? `${hitungUsiaBulan(p.tanggalLahir)} Bln`
                  : `${hitungUsiaTahun(p.tanggalLahir)} Thn`;

                return `

                        <p><span class="text-slate-400">NIK (Login):</span> <strong class="font-mono text-slate-800">${escapeHtml(p.nik)}</strong> &bull; PIN: <strong class="font-mono text-teal-700">${escapeHtml(p.pin)}</strong></p>
                        ${p.penerimaMBG ? `<p><span class="text-slate-400">Kategori MBG:</span> <strong class="text-emerald-700">${escapeHtml(p.kategoriMBG || klas.label)}</strong></p>` : ''}

        return (item.subKlasifikasi || '').toUpperCase().includes(appState.reportSasaran);

    function initKmsChart() {
      const canvas = document.getElementById('kms-growth-chart');
      if (!canvas || typeof Chart === 'undefined') return;
      const riwayat = getMyPemeriksaanList();
      if (riwayat.length === 0) return;

      const labels = riwayat.map(r => formatTanggalIndo(r.tanggalPeriksa));
      const dataBB = riwayat.map(r => r.beratBadan);
      const dataTB = riwayat.map(r => r.tinggiBadan);

      new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Berat Badan (kg)',
              data: dataBB,
              borderColor: '#0d9488',
              backgroundColor: 'rgba(13, 148, 136, 0.15)',
              tension: 0.35,
              fill: true,
              yAxisID: 'y'
            },
            {
              label: 'Tinggi Badan (cm)',
              data: dataTB,
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.1)',
              tension: 0.35,
              fill: false,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Berat (kg)' } },
            y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Tinggi (cm)' } }
          }
        }
      });
    }

    function initSuratTugasSignaturePad() {
      const canvas = document.getElementById('st-signature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const cy = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
      };

      const startDraw = (e) => {
        e.preventDefault();
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#002060';
      };

      const moveDraw = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (drawing) {
          drawing = false;
          ctx.closePath();
        }
      };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);

      document.getElementById('btn-st-clear-sig')?.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveGlobalSignature('');
      });

      document.getElementById('btn-st-apply-sig')?.addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        appState.suratTugas.signatureDataUrl = dataUrl;
        const img = document.getElementById('st-view-sig-img');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang sementara ke surat.', 'success');
      });

      document.getElementById('btn-st-save-default-sig')?.addEventListener('click', () => {
        const dataUrl = appState.suratTugas.signatureDataUrl || canvas.toDataURL('image/png');
        saveGlobalSignature(dataUrl);
      });
    }

    function downloadSuratTugasDocx() {
      const paperEl = document.getElementById('surat-tugas-paper-doc');
      if (!paperEl) return;
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Surat Tugas</title><style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;}table{border-collapse:collapse;width:100%;}</style></head><body>";
      const footer = "</body></html>";
      const fullDoc = header + paperEl.innerHTML + footer;

      const blob = new Blob(['\ufeff' + fullDoc], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Surat_Tugas_${appState.suratTugas.namaPosyandu.replace(/\s+/g, '_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function renderApp() {
      const mount = document.getElementById('app-mount');

      if (!appState.role) {
        if (appState.showLoginView) {
          mount.innerHTML = renderLoginScreen();
        } else {
          mount.innerHTML = renderLandingPage();
        }
        bindLoginEvents();
        return;
      }

      let mainContent = '';
      if (appState.role === 'admin') {
        if (appState.activeTab === 'dashboard') mainContent = renderAdminDashboard();
        else if (appState.activeTab === 'peserta') mainContent = renderAdminPeserta();
        else if (appState.activeTab === 'pemeriksaan') mainContent = renderAdminPemeriksaan();
        else if (appState.activeTab === 'mbg') mainContent = renderAdminMBG();
        else if (appState.activeTab === 'jadwal') mainContent = renderAdminJadwal();
        else if (appState.activeTab === 'artikel') mainContent = renderAdminArtikel();
        else if (appState.activeTab === 'galeri') mainContent = renderAdminGaleri();
        else if (appState.activeTab === 'kader') mainContent = renderAdminKader();
        else if (appState.activeTab === 'surattugas') mainContent = renderAdminSuratTugas();
        else if (appState.activeTab === 'laporan') mainContent = renderAdminLaporan();

        if (appState.activeTab === 'beranda') mainContent = renderUserBeranda();

          <main class="main-content-area px-4 sm:px-8 pt-6 max-w-6xl">

      document.querySelectorAll('[data-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-kader');
          confirmDialog('Hapus Data Kader?', 'Data kader ini akan dihapus dari daftar.', () => deleteKader(id));
        });
      });

      document.getElementById('btn-st-pdf')?.addEventListener('click', () => {
        printCleanElement('surat-tugas-paper-doc', 'Surat Tugas Posyandu Nusa Indah 20');
      });
      document.getElementById('btn-st-docx')?.addEventListener('click', downloadSuratTugasDocx);

      document.getElementById('btn-st-tab-form')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'form';
        renderApp();
      });
      document.getElementById('btn-st-tab-preview')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'preview';
        renderApp();
      });

      document.getElementById('input-st-logo')?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressedLogo = await compressLogoImage(file);
          await saveGlobalLogo(compressedLogo);
        } catch (err) {
          showToast('Gagal memproses file gambar logo.', 'error');
        }
      });

      document.getElementById('btn-st-reset-logo')?.addEventListener('click', () => {
        saveGlobalLogo('');
      });

      document.getElementById('st-nama-posyandu')?.addEventListener('input', (e) => {
        appState.suratTugas.namaPosyandu = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-alamat-posyandu')?.addEventListener('input', (e) => {
        appState.suratTugas.alamatPosyandu = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-no-surat')?.addEventListener('input', (e) => {
        appState.suratTugas.noSurat = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-nama-ketua')?.addEventListener('input', (e) => {
        appState.suratTugas.namaKetua = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-jabatan-ketua')?.addEventListener('input', (e) => {
        appState.suratTugas.jabatanKetua = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-kota')?.addEventListener('input', (e) => {
        appState.suratTugas.kota = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-tgl-surat')?.addEventListener('change', (e) => {
        appState.suratTugas.tglSurat = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-tgl-mulai')?.addEventListener('change', (e) => {
        appState.suratTugas.tglMulai = e.target.value;
        syncSuratTugasLivePreview();
      });
      document.getElementById('st-tgl-selesai')?.addEventListener('change', (e) => {
        appState.suratTugas.tglSelesai = e.target.value;
        syncSuratTugasLivePreview();
      });

      document.getElementById('btn-st-add-kader')?.addEventListener('click', () => {
        const activeKaders = appState.kaderList.filter(k => (k.status || 'Aktif') === 'Aktif');
        const defaultPick = activeKaders[0] ? { nama: activeKaders[0].nama, jabatan: activeKaders[0].jabatan } : { nama: '', jabatan: 'Kader' };
        appState.suratTugas.kaderAssigned.push(defaultPick);
        renderApp();
      });

      document.querySelectorAll('[data-st-kader-select]').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const idx = parseInt(sel.getAttribute('data-st-kader-select'), 10);
          const selectedOption = e.target.options[e.target.selectedIndex];
          appState.suratTugas.kaderAssigned[idx].nama = e.target.value;
          const autoJab = selectedOption?.getAttribute('data-jabatan');
          if (autoJab) {
            appState.suratTugas.kaderAssigned[idx].jabatan = autoJab;
          }
          renderApp();
        });
      });

      document.querySelectorAll('[data-st-kader-nama]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const idx = parseInt(inp.getAttribute('data-st-kader-nama'), 10);
          appState.suratTugas.kaderAssigned[idx].nama = e.target.value;
          syncSuratTugasLivePreview();
        });
      });

      document.querySelectorAll('[data-st-kader-jabatan]').forEach(inp => {
        inp.addEventListener('input', (e) => {
          const idx = parseInt(inp.getAttribute('data-st-kader-jabatan'), 10);
          appState.suratTugas.kaderAssigned[idx].jabatan = e.target.value;
          syncSuratTugasLivePreview();
        });
      });

      document.querySelectorAll('[data-st-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-st-del-kader'), 10);
          appState.suratTugas.kaderAssigned.splice(idx, 1);
          renderApp();
        });
      });

      document.getElementById('input-st-upload-sig')?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressedSig = await compressLogoImage(file);
          await saveGlobalSignature(compressedSig);
        } catch (err) {
          showToast('Gagal memproses gambar TTD / Stempel.', 'error');
        }
      });

      document.getElementById('btn-add-mbg')?.addEventListener('click', () => openMBGFormModal());

      document.querySelectorAll('[data-del-mbg]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-mbg');
          confirmDialog('Hapus Catatan MBG?', 'Riwayat penyaluran paket MBG ini akan dihapus.', () => deleteDistribusiMBG(id));
        });
      });

      document.getElementById('btn-trigger-print-pdf')?.addEventListener('click', () => {
        printCleanElement('print-report-area', 'Laporan Posyandu & MBG Nusa Indah 20');
      });

      document.getElementById('select-report-type')?.addEventListener('change', (e) => {
        appState.reportType = e.target.value;
        renderApp();
      });

      document.getElementById('input-report-month')?.addEventListener('change', (e) => {
        appState.reportMonth = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-year')?.addEventListener('change', (e) => {
        appState.reportYear = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-sasaran')?.addEventListener('change', (e) => {
        appState.reportSasaran = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-category')?.addEventListener('change', (e) => {
        appState.reportCategory = e.target.value;
        renderApp();
      });

      document.getElementById('input-report-signer')?.addEventListener('input', (e) => {
        appState.reportSignerName = e.target.value;
        const elName = document.getElementById('rep-view-signer-name');
        if (elName) {
          elName.textContent = `( ${e.target.value || '........................................'} )`;
        }
      });

      document.getElementById('input-rep-upload-sig')?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const compressedSig = await compressLogoImage(file);
          await saveGlobalSignature(compressedSig);
        } catch (err) {
          showToast('Gagal memproses gambar Stamp & TTD.', 'error');
        }
      });

      document.getElementById('btn-add-pemeriksaan')?.addEventListener('click', () => openPemeriksaanFormModal());

      document.querySelectorAll('[data-del-pemeriksaan]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-pemeriksaan');
          confirmDialog('Hapus Catatan Pemeriksaan?', 'Riwayat pemeriksaan ini akan dihapus.', () => deletePemeriksaan(id));
        });
      });

      document.getElementById('btn-add-jadwal')?.addEventListener('click', () => openJadwalFormModal());

      document.querySelectorAll('[data-edit-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-jadwal');
          const item = appState.jadwalList.find(j => j.id === id);
          if (item) openJadwalFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-jadwal');
          confirmDialog('Hapus Jadwal?', 'Pengumuman jadwal kegiatan ini akan dihapus.', () => deleteJadwal(id));
        });
      });

      document.getElementById('btn-add-artikel')?.addEventListener('click', () => openArtikelFormModal());

      document.querySelectorAll('[data-edit-artikel]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-artikel');
          const item = appState.artikelList.find(a => a.id === id);
          if (item) openArtikelFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-artikel]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-artikel');
          confirmDialog('Hapus Artikel?', 'Artikel edukasi / info ini akan dihapus.', () => deleteArtikel(id));
        });
      });

      document.getElementById('btn-add-galeri')?.addEventListener('click', () => openGaleriFormModal());

      document.querySelectorAll('[data-del-galeri]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-galeri');
          confirmDialog('Hapus Foto?', 'Foto ini akan dihapus dari galeri.', () => deleteGaleri(id));
        });
      });
    }

    // =========================================================================
    // BOOTSTRAP APLIKASI
    // =========================================================================
    if (!IS_PREVIEW && db) {
      startPublicRealtimeSync();
    }

    if (!IS_PREVIEW && auth) {
      onAuthStateChanged(auth, (user) => {
        if (user && appState.role !== 'admin') {
          appState.role = 'admin';
          appState.currentUser = { uid: user.uid, email: user.email };
          appState.activeTab = 'dashboard';
          startAdminRealtimeSync();
        }
        renderApp();
      });
    } else {
      renderApp();
    }
  </script>
</body>
</html>
