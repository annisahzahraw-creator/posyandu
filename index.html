    // =========================================================================

    // =========================================================================

    // =========================================================================
    const appState = {
      role: null,

      activeTab: 'dashboard',
      loginTab: 'user',
      searchQuery: '',
      filterMbg: 'ALL',
      filterStatus: 'ALL',
      filterKategori: 'ALL',
      reportType: 'monthly',
      reportMonth: new Date().toISOString().slice(0, 7),
      reportYear: new Date().getFullYear().toString(),
      reportCategory: 'semua',
      pesertaList: [],
      pemeriksaanList: [],
      mbgList: [],
      jadwalList: [],
      kaderList: [],
      loading: false,
      globalLogoDataUrl: DEFAULT_POSYANDU_LOGO_URL,
      globalSignatureDataUrl: DEFAULT_POSYANDU_SIGNATURE_URL,
      suratTugas: {
        logoDataUrl: DEFAULT_POSYANDU_LOGO_URL,
        namaPosyandu: 'POSYANDU NUSA INDAH XX',
        alamatPosyandu: 'Jln. Syekh Quro Palumbonsari, Karawang Timur',
        noSurat: '001/XI/2026',
        namaKetua: 'HELYATI NUR',
        jabatanKetua: 'Ketua Kader Posyandu Nusa Indah XX',
        kota: 'Karawang Timur',
        tglSurat: new Date().toISOString().split('T')[0],
        tglMulai: new Date().toISOString().split('T')[0],
        tglSelesai: new Date(Date.now() + 4*86400000).toISOString().split('T')[0],
        kaderAssigned: [{ nama: 'Ismayawati', jabatan: 'Kader' }],
        signatureDataUrl: DEFAULT_POSYANDU_SIGNATURE_URL,

      reportNamaKetua: 'HELYATI NUR'

    // Muat profil publik (logo & stempel default) dari Firestore sebelum login
    async function loadPublicPosyanduProfile() {
      if (IS_PREVIEW || !db) return;
      try {
        const docRef = doc(db, 'pengaturan', 'profil_posyandu');
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const cfg = docSnap.data();
          const logoUrl = cfg.logoDataUrl || DEFAULT_POSYANDU_LOGO_URL;
          const sigUrl = cfg.signatureDataUrl || DEFAULT_POSYANDU_SIGNATURE_URL;
          const ketuaName = cfg.namaKetua || 'HELYATI NUR';
          
          appState.globalLogoDataUrl = logoUrl;
          appState.suratTugas.logoDataUrl = logoUrl;
          appState.globalSignatureDataUrl = sigUrl;
          appState.suratTugas.signatureDataUrl = sigUrl;
          appState.reportSignatureDataUrl = sigUrl;
          appState.reportNamaKetua = ketuaName;
          appState.suratTugas.namaKetua = ketuaName;
          renderApp();
        }
      } catch (e) {}
    }

    // =========================================================================
    // UTILITAS UI & HELPER
    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button class="text-white/80 hover:text-white font-bold text-lg leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('custom-modal-backdrop');
      const box = document.getElementById('custom-modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('custom-modal-backdrop');
      backdrop.classList.add('hidden');
    }

    function confirmDialog(title, message, onConfirm) {
      openModal(`
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 font-bold">!</div>
          <div class="flex-1">
            <h3 class="text-lg font-bold text-slate-900">${escapeHtml(title)}</h3>
            <p class="text-sm text-slate-600 mt-1">${escapeHtml(message)}</p>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Batal</button>
          <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 transition shadow-sm">Ya, Hapus</button>
        </div>
      `);
      document.getElementById('modal-cancel-btn').onclick = closeModal;
      document.getElementById('modal-confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    function getKategoriSasaran(p) {
      const kat = p.kategori || 'Balita';
      if (kat === 'Balita') {
        const usia = hitungUsiaBulan(p.tanggalLahir);
        return usia < 24 ? 'Baduta (< 2 Thn)' : 'Balita (2–5 Thn)';
      }
      return kat;
    }

    function getStatusBadge(status) {
      if (status === 'Normal' || status === 'Sehat') {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Normal / Sehat</span>`;
      } else if (status === 'Gizi Kurang' || status === 'Risiko Tinggi') {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">${escapeHtml(status)}</span>`;
      } else {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">${escapeHtml(status || 'Perlu Pantauan')}</span>`;
      }
    }

    function printCleanElement(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = '0';
      document.body.appendChild(iframe);

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <meta charset="utf-8">
          <title>Cetak Dokumen</title>
          <style>
            body { font-family: "Times New Roman", Times, serif; color: #111827; margin: 0; padding: 15mm; font-size: 11pt; line-height: 1.5; background: #fff; }
            table { width: 100%; border-collapse: collapse; margin: 8px 0; }
            th, td { padding: 5px 8px; border: 1px solid #cbd5e1; font-size: 10pt; text-align: left; }
            th { background: #f1f5f9; }
            .no-print { display: none !important; }
            @page { size: A4 portrait; margin: 0; }
          </style>
        </head>
        <body>
          ${el.innerHTML}
        </body>
        </html>
      `);
      doc.close();

      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => document.body.removeChild(iframe), 1000);
      }, 500);
    }

    // =========================================================================
    // SINKRONISASI FIRESTORE REAL-TIME
    // =========================================================================
    function clearFirestoreListeners() {
      unsubscribers.forEach(unsub => {
        if (typeof unsub === 'function') unsub();
      });
      unsubscribers = [];
    }

    function startAdminRealtimeSync() {
      if (IS_PREVIEW || !db) return;
      clearFirestoreListeners();

      const unsubPeserta = onSnapshot(collection(db, 'peserta'), (snapshot) => {
        appState.pesertaList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      });

      const unsubPemeriksaan = onSnapshot(collection(db, 'pemeriksaan'), (snapshot) => {
        appState.pemeriksaanList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.tanggalPeriksa || '').localeCompare(a.tanggalPeriksa || ''));
        renderApp();
      });

      const unsubJadwal = onSnapshot(collection(db, 'jadwal'), (snapshot) => {
        appState.jadwalList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.tanggal || '').localeCompare(b.tanggal || ''));
        renderApp();
      });

      const unsubMbg = onSnapshot(collection(db, 'distribusi_mbg'), (snapshot) => {
        appState.mbgList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.tanggalDistribusi || '').localeCompare(a.tanggalDistribusi || ''));
        renderApp();
      });

      const unsubKader = onSnapshot(collection(db, 'kader'), (snapshot) => {
        appState.kaderList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      });

      const unsubSettings = onSnapshot(doc(db, 'pengaturan', 'profil_posyandu'), (docSnap) => {
        if (docSnap.exists()) {
          const cfg = docSnap.data();
          if (cfg.logoDataUrl) {
            appState.globalLogoDataUrl = cfg.logoDataUrl;
            appState.suratTugas.logoDataUrl = cfg.logoDataUrl;
          }
          if (cfg.signatureDataUrl) {
            appState.globalSignatureDataUrl = cfg.signatureDataUrl;
            appState.suratTugas.signatureDataUrl = cfg.signatureDataUrl;
            appState.reportSignatureDataUrl = cfg.signatureDataUrl;
          }
          if (cfg.namaKetua) {
            appState.reportNamaKetua = cfg.namaKetua;
            appState.suratTugas.namaKetua = cfg.namaKetua;
          }
          renderApp();
        }
      });

      unsubscribers.push(unsubPeserta, unsubPemeriksaan, unsubJadwal, unsubMbg, unsubKader, unsubSettings);
    }

    function startUserRealtimeSync(pesertaId, nik) {
      if (IS_PREVIEW || !db) return;
      clearFirestoreListeners();

      const unsubProfil = onSnapshot(doc(db, 'peserta', pesertaId), (docSnap) => {
        if (docSnap.exists()) {
          appState.currentUser = { id: docSnap.id, ...docSnap.data() };
          renderApp();
        }
      });

      const qPeriksa = query(collection(db, 'pemeriksaan'), where('nik', '==', nik));
      const unsubPeriksa = onSnapshot(qPeriksa, (snapshot) => {
        appState.pemeriksaanList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.tanggalPeriksa || '').localeCompare(b.tanggalPeriksa || ''));
        renderApp();
      });

      const unsubJadwal = onSnapshot(collection(db, 'jadwal'), (snapshot) => {
        appState.jadwalList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.tanggal || '').localeCompare(b.tanggal || ''));
        renderApp();
      });

      const qMbg = query(collection(db, 'distribusi_mbg'), where('nik', '==', nik));
      const unsubMbg = onSnapshot(qMbg, (snapshot) => {
        appState.mbgList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.tanggalDistribusi || '').localeCompare(a.tanggalDistribusi || ''));
        renderApp();
      });

      unsubscribers.push(unsubProfil, unsubPeriksa, unsubJadwal, unsubMbg);
    }

    async function handleAdminLogin(email, password) {
      if (IS_PREVIEW) {
        if (email === 'admin@nusaindah20.id' && password === 'admin123') {
          appState.role = 'admin';
          appState.currentUser = { email: 'admin@nusaindah20.id', nama: 'Kader Posyandu Nusa Indah XX' };
          appState.activeTab = 'dashboard';
          showToast('Berhasil masuk sebagai Admin (Mode Preview)', 'success');
          renderApp();
        } else {
          showToast('Email atau Password demo salah.', 'error');
        }
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const cred = await signInWithEmailAndPassword(auth, email, password);
        appState.role = 'admin';
        appState.currentUser = { uid: cred.user.uid, email: cred.user.email };
        appState.activeTab = 'dashboard';
        appState.loading = false;
        startAdminRealtimeSync();
        showToast('Selamat datang, Admin Kader Posyandu!', 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Login Admin Gagal: Periksa Email & Password Anda.', 'error');
        renderApp();
      }
    }

    async function handleUserLogin(nik, pin) {
      const cleanNik = nik.trim();
      const cleanPin = pin.trim();
      if (!cleanNik || !cleanPin) {
        showToast('NIK dan PIN wajib diisi.', 'error');
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const q = query(
          collection(db, 'peserta'),
          where('nik', '==', cleanNik),
          where('pin', '==', cleanPin)
        );
        const snap = await getDocs(q);
        appState.loading = false;

        if (snap.empty) {
          showToast('NIK atau PIN tidak sesuai. Hubungi Kader Posyandu.', 'error');
          renderApp();
          return;
        }

        const docPeserta = snap.docs[0];
        const userData = { id: docPeserta.id, ...docPeserta.data() };
        appState.role = 'user';
        appState.currentUser = userData;
        appState.activeTab = 'beranda';
        startUserRealtimeSync(userData.id, userData.nik);
        showToast(`Selamat datang, Orang Tua dari ${userData.namaAnak || userData.namaSasaran}!`, 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Kesalahan saat memverifikasi akun: ' + err.message, 'error');
        renderApp();
      }
    }

    async function handleLogout() {
      clearFirestoreListeners();
      if (!IS_PREVIEW && auth && appState.role === 'admin') {
        try { await signOut(auth); } catch (e) {}
      }
      appState.role = null;
      appState.currentUser = null;
      showToast('Anda telah keluar dari sesi.', 'info');
      renderApp();
    }

    function initKmsChart() {
      const canvas = document.getElementById('kms-growth-chart');
      if (!canvas || typeof Chart === 'undefined') return;
      const riwayat = getMyPemeriksaanList().filter(r => r.beratBadan && r.tinggiBadan);
      if (riwayat.length === 0) return;

      const labels = riwayat.map(r => `${hitungUsiaBulan(appState.currentUser.tanggalLahir, r.tanggalPeriksa)} Bln (${formatTanggalIndo(r.tanggalPeriksa)})`);
      const dataBB = riwayat.map(r => r.beratBadan);
      const dataTB = riwayat.map(r => r.tinggiBadan);

      new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'Berat Badan (kg)', data: dataBB, borderColor: '#0d9488', backgroundColor: 'rgba(13, 148, 136, 0.15)', tension: 0.35, fill: true, yAxisID: 'y' },
            { label: 'Tinggi Badan (cm)', data: dataTB, borderColor: '#6366f1', backgroundColor: 'rgba(99, 102, 241, 0.1)', tension: 0.35, fill: false, yAxisID: 'y1' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Berat (kg)' } },
            y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Tinggi (cm)' } }
          }
        }
      });
    }

    // =========================================================================
    // MAIN RENDERER & EVENT BINDING
    // =========================================================================
    function renderApp() {
      const mount = document.getElementById('app-mount');

      if (!appState.role) {
        mount.innerHTML = renderLoginScreen();
        bindLoginEvents();
        return;
      }

      let mainContent = '';
      if (appState.role === 'admin') {
        if (appState.activeTab === 'dashboard') mainContent = renderAdminDashboard();
        else if (appState.activeTab === 'peserta') mainContent = renderAdminPeserta();
        else if (appState.activeTab === 'pemeriksaan') mainContent = renderAdminPemeriksaan();
        else if (appState.activeTab === 'mbg') mainContent = renderAdminMBG();
        else if (appState.activeTab === 'kader') mainContent = renderAdminKader();
        else if (appState.activeTab === 'suratTugas') mainContent = renderAdminSuratTugas();
        else if (appState.activeTab === 'laporan') mainContent = renderAdminLaporan();
        else if (appState.activeTab === 'jadwal') mainContent = renderAdminJadwal();
      } else {
        if (appState.activeTab === 'beranda') mainContent = renderUserBeranda();
        else if (appState.activeTab === 'kms') mainContent = renderUserKMS();
      }

      mount.innerHTML = `
        <div class="min-h-screen bg-slate-50/70">
          ${renderNavigation()}
          <main class="main-content-area px-4 sm:px-8 pt-6 max-w-6xl">
            ${mainContent}
          </main>
        </div>
      `;

      bindAuthenticatedEvents();

      if (appState.role === 'user' && appState.activeTab === 'kms') {
        initKmsChart();
      }
    }

    function bindLoginEvents() {
      document.getElementById('tab-login-user')?.addEventListener('click', () => { appState.loginTab = 'user'; renderApp(); });
      document.getElementById('tab-login-admin')?.addEventListener('click', () => { appState.loginTab = 'admin'; renderApp(); });

      document.getElementById('toggle-user-pin')?.addEventListener('click', () => {
        const input = document.getElementById('input-user-pin');
        if (input) input.type = input.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('toggle-admin-pass')?.addEventListener('click', () => {
        const input = document.getElementById('input-admin-pass');
        if (input) input.type = input.type === 'password' ? 'text' : 'password';
      });

      document.getElementById('form-login-user')?.addEventListener('submit', (e) => {
        e.preventDefault();
        handleUserLogin(document.getElementById('input-user-nik').value, document.getElementById('input-user-pin').value);
      });

      document.getElementById('form-login-admin')?.addEventListener('submit', (e) => {
        e.preventDefault();
        handleAdminLogin(document.getElementById('input-admin-email').value, document.getElementById('input-admin-pass').value);
      });
    }

    function bindAuthenticatedEvents() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeTab = btn.getAttribute('data-nav');
          renderApp();
        });
      });

      document.getElementById('btn-logout-desktop')?.addEventListener('click', handleLogout);
      document.getElementById('btn-logout-mobile')?.addEventListener('click', handleLogout);

      // Peserta events
      document.getElementById('btn-add-peserta')?.addEventListener('click', () => openPesertaFormModal());
      document.getElementById('search-peserta-input')?.addEventListener('input', (e) => {
        appState.searchQuery = e.target.value;
        renderApp();
        const inp = document.getElementById('search-peserta-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
      document.getElementById('filter-kategori-select')?.addEventListener('change', (e) => { appState.filterKategori = e.target.value; renderApp(); });
      document.getElementById('filter-status-select')?.addEventListener('change', (e) => { appState.filterStatus = e.target.value; renderApp(); });
      document.getElementById('filter-mbg-select')?.addEventListener('change', (e) => { appState.filterMbg = e.target.value; renderApp(); });

      document.querySelectorAll('[data-edit-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = appState.pesertaList.find(p => p.id === btn.getAttribute('data-edit-peserta'));
          if (item) openPesertaFormModal(item);
        });
      });
      document.querySelectorAll('[data-del-peserta]').forEach(btn => {
        btn.addEventListener('click', () => confirmDialog('Hapus Peserta?', 'Data akan dihapus permanen.', () => deletePeserta(btn.getAttribute('data-del-peserta'))));
      });

      // Kader events
      document.getElementById('btn-add-kader')?.addEventListener('click', () => openKaderFormModal());
      document.querySelectorAll('[data-edit-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = appState.kaderList.find(k => k.id === btn.getAttribute('data-edit-kader'));
          if (item) openKaderFormModal(item);
        });
      });
      document.querySelectorAll('[data-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => confirmDialog('Hapus Kader?', 'Data kader akan dihapus.', () => deleteKader(btn.getAttribute('data-del-kader'))));
      });

      // Pemeriksaan & MBG & Jadwal
      document.getElementById('btn-add-pemeriksaan')?.addEventListener('click', () => openPemeriksaanFormModal());
      document.querySelectorAll('[data-del-pemeriksaan]').forEach(btn => {
        btn.addEventListener('click', () => confirmDialog('Hapus Pemeriksaan?', 'Data akan dihapus.', () => deletePemeriksaan(btn.getAttribute('data-del-pemeriksaan'))));
      });
      document.getElementById('btn-add-mbg')?.addEventListener('click', () => openMBGFormModal());
      document.querySelectorAll('[data-del-mbg]').forEach(btn => {
        btn.addEventListener('click', () => confirmDialog('Hapus MBG?', 'Data akan dihapus.', () => deleteDistribusiMBG(btn.getAttribute('data-del-mbg'))));
      });
      document.getElementById('btn-add-jadwal')?.addEventListener('click', () => openJadwalFormModal());
      document.querySelectorAll('[data-edit-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = appState.jadwalList.find(j => j.id === btn.getAttribute('data-edit-jadwal'));
          if (item) openJadwalFormModal(item);
        });
      });
      document.querySelectorAll('[data-del-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => confirmDialog('Hapus Jadwal?', 'Data akan dihapus.', () => deleteJadwal(btn.getAttribute('data-del-jadwal'))));
      });

      // Surat Tugas events
      document.getElementById('st-add-kader-row')?.addEventListener('click', () => {
        appState.suratTugas.kaderAssigned.push({ nama: '', jabatan: 'Kader' });
        renderApp();
      });
      document.querySelectorAll('[data-st-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.suratTugas.kaderAssigned.splice(parseInt(btn.getAttribute('data-st-del-kader'), 10), 1);
          renderApp();
        });
      });
      document.querySelectorAll('.st-kader-sel').forEach(sel => {
        sel.addEventListener('change', (e) => {
          const idx = parseInt(sel.getAttribute('data-st-kader-idx'), 10);
          const selectedName = e.target.value;
          const foundKader = appState.kaderList.find(k => k.nama === selectedName);
          appState.suratTugas.kaderAssigned[idx].nama = selectedName;
          appState.suratTugas.kaderAssigned[idx].jabatan = foundKader ? foundKader.jabatan : 'Kader';
        });
      });

      document.getElementById('input-st-logo')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => saveGlobalLogo(ev.target.result);
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('input-st-sig')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => saveGlobalSignature(ev.target.result);
          reader.readAsDataURL(file);
        }
      });

      // Laporan PDF events
      document.getElementById('select-report-type')?.addEventListener('change', (e) => { appState.reportType = e.target.value; renderApp(); });
      document.getElementById('input-report-month')?.addEventListener('change', (e) => { appState.reportMonth = e.target.value; renderApp(); });
      document.getElementById('select-report-year')?.addEventListener('change', (e) => { appState.reportYear = e.target.value; renderApp(); });
      document.getElementById('input-report-sig')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => saveGlobalSignature(ev.target.result);
          reader.readAsDataURL(file);
        }
      });
    }

    // =========================================================================
    // BOOTSTRAP APLIKASI
    // =========================================================================
    if (!IS_PREVIEW && auth) {
      loadPublicPosyanduProfile();
      onAuthStateChanged(auth, (user) => {
        if (user && appState.role !== 'admin') {
          appState.role = 'admin';
          appState.currentUser = { uid: user.uid, email: user.email };
          appState.activeTab = 'dashboard';
          startAdminRealtimeSync();
        }
        renderApp();
      });
    } else {
      renderApp();
    }
  </script>
</body>
</html>
