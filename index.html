    // =========================================================================

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button class="text-white/80 hover:text-white font-bold text-lg leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

      input.value = ''; // Reset input

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function formatTanggalDDMMYYYY(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2].padStart(2, '0')}-${parts[1].padStart(2, '0')}-${parts[0]}`;
    }

    function formatTanggalSuratFull(dateStr) {
      if (!dateStr) return '';
      const bulanFull = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const tgl = parseInt(parts[2], 10);
      const bln = bulanFull[parseInt(parts[1], 10) - 1] || '';
      return `${tgl < 10 ? '0' + tgl : tgl} ${bln} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    function hitungUsiaTahun(tglLahirStr) {
      return Math.floor(hitungUsiaBulan(tglLahirStr) / 12);
    }

    function convertDateExcel(val) {
      if (val === null || val === undefined || val === '') return '';
      // Jika berasal dari file Excel (.xlsx) berupa angka serial tanggal
      if (typeof val === 'number' && !isNaN(val)) {
        const utcDays = Math.floor(val - 25569);
        const dateObj = new Date(utcDays * 86400 * 1000);
        if (!isNaN(dateObj.getTime())) {
          const y = dateObj.getUTCFullYear();
          const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
          const d = String(dateObj.getUTCDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        }
      }
      const dateStr = String(val).trim();
      // Sudah format YYYY-MM-DD
      if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
      // Format DD-MM-YYYY
      if (/^\d{1,2}-\d{1,2}-\d{4}$/.test(dateStr)) {
        const [d, m, y] = dateStr.split('-');
        return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
      }
      // Format M/D/YYYY (atau MM/DD/YYYY) dari copy-paste Excel
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        let m = parts[0].padStart(2, '0');
        let d = parts[1].padStart(2, '0');
        let y = parts[2];
        return `${y}-${m}-${d}`;
      }
      return dateStr;
    }

    function getKlasifikasiSasaran(peserta) {
      const kel = peserta.kelompokSasaran || 'ANAK';
      if (kel === 'LANSIA') {
        return { kode: 'LANSIA', label: 'Lansia', badgeClass: 'bg-purple-100 text-purple-800' };
      }
      if (kel === 'BUMIL_BUSUI') {
        return { kode: 'BUMIL_BUSUI', label: 'Ibu Hamil / Menyusui', badgeClass: 'bg-pink-100 text-pink-800' };
      }
      const usiaBln = hitungUsiaBulan(peserta.tanggalLahir);
      if (usiaBln < 24) {
        return { kode: 'BADUTA', label: 'Baduta (< 2 Thn)', badgeClass: 'bg-sky-100 text-sky-800' };
      }
      return { kode: 'BALITA', label: 'Balita (2–5 Thn)', badgeClass: 'bg-indigo-100 text-indigo-800' };
    }

        return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700">${escapeHtml(status)}</span>`;

      }
      return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-teal-50 text-teal-700">${escapeHtml(status || 'Normal')}</span>`;
    }

          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.tanggal || '').localeCompare(b.tanggal || ''));

    }

    async function handleUserLogin(nik, pin) {
      const cleanNik = nik.trim();
      const cleanPin = pin.trim();

      if (!cleanNik || !cleanPin) {
        showToast('NIK dan PIN wajib diisi.', 'error');
        return;
      }

      if (IS_PREVIEW) {
        const found = appState.pesertaList.find(p => p.nik === cleanNik && p.pin === cleanPin);
        if (found) {
          if (found.statusAktif === 'Non-Aktif') {
            showToast('Status kepesertaan Anda Non-Aktif.', 'error');
            return;
          }
          appState.role = 'user';
          appState.currentUser = found;
          appState.activeTab = 'beranda';
          showToast(`Selamat datang, ${found.namaAnak}!`, 'success');
          renderApp();
        } else {
          showToast('NIK atau PIN peserta tidak ditemukan.', 'error');
        }
        return;
      }

      if (!db) {
        showToast('Koneksi database Firestore belum tersedia.', 'error');
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const q = query(
          collection(db, 'peserta'),
          where('nik', '==', cleanNik),
          where('pin', '==', cleanPin)
        );
        const snap = await getDocs(q);
        appState.loading = false;

        if (snap.empty) {
          showToast('NIK atau PIN tidak sesuai. Hubungi Kader Posyandu Nusa Indah XX.', 'error');
          renderApp();
          return;
        }

        const docPeserta = snap.docs[0];
        const userData = { id: docPeserta.id, ...docPeserta.data() };
        if (userData.statusAktif === 'Non-Aktif') {
          showToast('Status kepesertaan Anda saat ini Non-Aktif.', 'error');
          renderApp();
          return;
        }

        appState.role = 'user';
        appState.currentUser = userData;
        appState.activeTab = 'beranda';
        startUserRealtimeSync(userData.id, userData.nik);
        showToast(`Selamat datang, ${userData.namaAnak}!`, 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Terjadi kesalahan saat memverifikasi akun peserta: ' + err.message, 'error');
        renderApp();
      }
    }

    function compressLogoImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 260;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png', 0.9));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressGalleryImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 800; // Standar optimal resolusi galeri ringan
            let w = img.width; let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getFilteredPesertaList() {
      const q = (appState.searchQuery || '').toLowerCase().trim();
      return appState.pesertaList.filter(p => {
        const klas = getKlasifikasiSasaran(p);
        const matchSearch = !q ||
          (p.namaAnak || '').toLowerCase().includes(q) ||
          (p.nik || '').toLowerCase().includes(q) ||
          (p.namaOrangTua || '').toLowerCase().includes(q) ||
          (p.alamat || '').toLowerCase().includes(q);
        const matchSasaran = appState.filterSasaran === 'ALL' || klas.kode === appState.filterSasaran;
        const matchStatus = appState.filterStatusAktif === 'ALL' || (p.statusAktif || 'Aktif') === appState.filterStatusAktif;
        const matchMbg = appState.filterMbg === 'ALL' ||
          (appState.filterMbg === 'YA' && !!p.penerimaMBG) ||
          (appState.filterMbg === 'TIDAK' && !p.penerimaMBG);
        return matchSearch && matchSasaran && matchStatus && matchMbg;
      });
    }

    function exportPesertaToExcel() {
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum siap. Coba muat ulang halaman.', 'error');
        return;
      }

      const list = getFilteredPesertaList();
      if (list.length === 0) {
        showToast('Tidak ada data peserta untuk di-export.', 'error');
        return;
      }

      const rows = [
        [
          'NO', 'NIK', 'NAMA LENGKAP', 'KELOMPOK SASARAN', 'L/P', 'TGL LAHIR (DD-MM-YYYY)',
          'NAMA AYAH', 'NAMA IBU', 'ORANG TUA / WALI', 'NIK ORANG TUA', 'ALAMAT',
          'STATUS AKTIF', 'PENERIMA MBG', 'KATEGORI MBG', 'HAMIL KE', 'TGL HPHT', 'TGL HPL',
          'NAMA ANAK (BUSUI)', 'NIK ANAK (BUSUI)', 'PIN LOGIN'
        ],
        ...list.map((p, idx) => {
          const klas = getKlasifikasiSasaran(p);
          return [
            idx + 1,
            String(p.nik || ''),
            (p.namaAnak || '').toUpperCase(),
            klas.label,
            p.jenisKelamin || 'L',
            formatTanggalDDMMYYYY(p.tanggalLahir),
            p.namaAyah || '',
            p.namaIbu || '',
            p.namaOrangTua || '',
            String(p.nikOrangTua || ''),
            p.alamat || '',
            p.statusAktif || 'Aktif',
            p.penerimaMBG ? 'YA' : 'TIDAK',
            p.penerimaMBG ? (p.kategoriMBG || '-') : '-',
            p.kehamilanKe || '',
            formatTanggalDDMMYYYY(p.hpht),
            formatTanggalDDMMYYYY(p.hpl),
            p.namaAnakTerkait || '',
            String(p.nikAnakTerkait || ''),
            String(p.pin || '123456')
          ];
        })
      ];

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [
        { wch: 5 }, { wch: 20 }, { wch: 28 }, { wch: 22 }, { wch: 5 }, { wch: 18 },
        { wch: 20 }, { wch: 20 }, { wch: 26 }, { wch: 20 }, { wch: 32 },
        { wch: 12 }, { wch: 14 }, { wch: 24 }, { wch: 10 }, { wch: 14 }, { wch: 14 },
        { wch: 24 }, { wch: 20 }, { wch: 10 }
      ];
      XLSX.utils.book_append_sheet(wb, ws, 'DATA PESERTA');
      XLSX.writeFile(wb, `Data_Peserta_Posyandu_Nusa_Indah_XX_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast(`Berhasil export ${list.length} data peserta ke Excel!`, 'success');
    }

    function downloadTemplateImportPeserta() {
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum siap. Coba muat ulang halaman.', 'error');
        return;
      }

      const templateRows = [
        ['NIK', 'Nama Anak', 'L/P', 'TGL Lahir (MM/DD/YYYY)', 'Nama Ayah', 'Nama Ibu', 'Alamat', 'NIK Orang Tua (Opsional)'],
        ['3215262611230001', 'Andika Rasif', 'L', '11/26/2023', 'Ilham', 'Ananda Puspita', 'Grand Permata RT.01 Blok C6 No.5', '3215265501950001'],
        ['3215262012210004', 'Liviannisa Cyra Zhafira', 'P', '06/27/2025', 'Willy Prasetyo.S', 'Novia Mayasari', 'Grand Permata RT.01 Blok C5 No.2', '']
      ];

      const panduanRows = [
        ['PANDUAN PENGISIAN TEMPLATE IMPORT DATA PESERTA POSYANDU NUSA INDAH XX'],
        [''],
        ['1. Jangan mengubah urutan kolom pada sheet "TEMPLATE_IMPORT" (A sampai H).'],
        ['2. Hapus 2 baris contoh di sheet "TEMPLATE_IMPORT", lalu isi dengan data warga Anda mulai dari baris ke-2.'],
        ['3. Format NIK: 16 digit angka (ketik tanda petik satu di depan jika Excel mengubahnya jadi 3,21E+15, misal: \'321526...).'],
        ['4. Format L/P: isi huruf L (Laki-laki) atau P (Perempuan).'],
        ['5. Format Tanggal Lahir: bisa MM/DD/YYYY (contoh: 11/26/2023), DD-MM-YYYY (contoh: 26-11-2023), atau langsung format Tanggal Excel.'],
        ['6. Kolom H (NIK Orang Tua) bersifat opsional, namun sangat disarankan diisi untuk kelengkapan Laporan MBG Balita.'],
        ['7. Setelah selesai, simpan file (.xlsx) lalu unggah langsung di tombol "Import Excel" pada aplikasi, ATAU copy-paste baris datanya.']
      ];

      const wb = XLSX.utils.book_new();
      const wsTemplate = XLSX.utils.aoa_to_sheet(templateRows);
      wsTemplate['!cols'] = [
        { wch: 20 }, { wch: 28 }, { wch: 6 }, { wch: 22 }, { wch: 22 }, { wch: 22 }, { wch: 36 }, { wch: 24 }
      ];
      const wsPanduan = XLSX.utils.aoa_to_sheet(panduanRows);
      wsPanduan['!cols'] = [{ wch: 95 }];

      XLSX.utils.book_append_sheet(wb, wsTemplate, 'TEMPLATE_IMPORT');
      XLSX.utils.book_append_sheet(wb, wsPanduan, 'PANDUAN');

      XLSX.writeFile(wb, 'Template_Import_Peserta_Posyandu_Nusa_Indah_XX.xlsx');
      showToast('Template Excel berhasil diunduh!', 'success');
    }

                          <p class="text-[11px] text-emerald-700 font-semibold">${escapeHtml(m.kategoriMBG || m.kelompokSasaran || '-')}</p>
                        </td>
                        <td class="py-3.5 px-4 text-xs">
                          <p class="font-medium text-slate-800">${escapeHtml(m.menuPaket)}</p>
                          ${m.keterangan ? `<p class="text-slate-400 mt-0.5">${escapeHtml(m.keterangan)}</p>` : ''}
                        </td>
                        <td class="py-3.5 px-4">
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-50 text-teal-700">${escapeHtml(m.statusTerima)}</span>
                        </td>
                        <td class="py-3.5 px-4 text-right">
                          <button data-del-mbg="${m.id}" class="text-xs font-bold text-rose-600 hover:underline">Hapus</button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // MENU BARU: LAPORAN PENERIMA MBG (3 TAB: BALITA, BUSUI, BUMIL)
    // =========================================================================
    function getMbgReportDatasets() {
      const aktifMbg = appState.pesertaList.filter(p => p.penerimaMBG && (p.statusAktif || 'Aktif') === 'Aktif');

      const balitaList = aktifMbg.filter(p => {
        const kel = p.kelompokSasaran || 'ANAK';
        return kel === 'ANAK';
      }).sort((a, b) => (a.namaAnak || '').localeCompare(b.namaAnak || ''));

      const busuiList = aktifMbg.filter(p => {
        const kel = p.kelompokSasaran || 'ANAK';
        const kat = (p.kategoriMBG || '').toLowerCase();
        return kel === 'BUMIL_BUSUI' && (kat.includes('busui') || kat.includes('menyusui'));
      }).sort((a, b) => (a.namaAnak || '').localeCompare(b.namaAnak || ''));

      const bumilList = aktifMbg.filter(p => {
        const kel = p.kelompokSasaran || 'ANAK';
        const kat = (p.kategoriMBG || '').toLowerCase();
        return kel === 'BUMIL_BUSUI' && !(kat.includes('busui') || kat.includes('menyusui'));
      }).sort((a, b) => (a.namaAnak || '').localeCompare(b.namaAnak || ''));

      return { balitaList, busuiList, bumilList };
    }

    function getMbgTabRows(tab) {
      const { balitaList, busuiList, bumilList } = getMbgReportDatasets();

      if (tab === 'BALITA') {
        return balitaList.map((p, i) => [
          i + 1,
          (p.namaAnak || '').toUpperCase(),
          formatTanggalDDMMYYYY(p.tanggalLahir),
          p.jenisKelamin || 'L',
          String(p.nik || ''),
          (p.namaIbu || p.namaAyah || p.namaOrangTua || '').toUpperCase(),
          String(p.nikOrangTua || '')
        ]);
      }

      if (tab === 'BUSUI') {
        return busuiList.map((p, i) => {
          let namaAnakTerkait = (p.namaAnakTerkait || '').trim();
          let nikAnakTerkait = (p.nikAnakTerkait || '').trim();
          if ((!namaAnakTerkait || !nikAnakTerkait) && (p.nik || '').endsWith('-IBU')) {
            const rawNikAnak = p.nik.replace(/-IBU$/, '');
            const anakObj = appState.pesertaList.find(a => a.nik === rawNikAnak);
            if (anakObj) {
              if (!namaAnakTerkait) namaAnakTerkait = anakObj.namaAnak || '';
              if (!nikAnakTerkait) nikAnakTerkait = anakObj.nik || '';
            }
          }
          return [
            i + 1,
            (p.namaAnak || '').toUpperCase(),
            formatTanggalDDMMYYYY(p.tanggalLahir),
            String(p.nik || ''),
            namaAnakTerkait.toUpperCase(),
            String(nikAnakTerkait || '')
          ];
        });
      }

      return bumilList.map((p, i) => [
        i + 1,
        (p.namaAnak || '').toUpperCase(),
        formatTanggalDDMMYYYY(p.tanggalLahir),
        String(p.nik || ''),
        formatTanggalDDMMYYYY(p.hpht)
      ]);
    }

    function exportMbgToExcel() {
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum siap. Coba muat ulang halaman.', 'error');
        return;
      }

      const wb = XLSX.utils.book_new();

      const balitaSheet = XLSX.utils.aoa_to_sheet([
        ['NO', 'NAMA PENERIMA', 'TGL LAHIR', 'JENIS KELAMIN', 'NIK', 'NAMA ORANG TUA', 'NIK ORANG TUA'],
        ...getMbgTabRows('BALITA')
      ]);
      balitaSheet['!cols'] = [{ wch: 5 }, { wch: 28 }, { wch: 14 }, { wch: 14 }, { wch: 20 }, { wch: 26 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, balitaSheet, 'BALITA');

      const busuiSheet = XLSX.utils.aoa_to_sheet([
        ['NO', 'NAMA PENERIMA', 'TGL LAHIR', 'NIK', 'NAMA ANAK', 'NIK ANAK'],
        ...getMbgTabRows('BUSUI')
      ]);
      busuiSheet['!cols'] = [{ wch: 5 }, { wch: 28 }, { wch: 14 }, { wch: 20 }, { wch: 28 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, busuiSheet, 'BUSUI');

      const bumilSheet = XLSX.utils.aoa_to_sheet([
        ['NO', 'NAMA PENERIMA', 'TGL LAHIR', 'NIK', 'TGL HPHT'],
        ...getMbgTabRows('BUMIL')
      ]);
      bumilSheet['!cols'] = [{ wch: 5 }, { wch: 28 }, { wch: 14 }, { wch: 20 }, { wch: 16 }];
      XLSX.utils.book_append_sheet(wb, bumilSheet, 'BUMIL');

      XLSX.writeFile(wb, `Laporan_Penerima_MBG_3B_${new Date().toISOString().split('T')[0]}.xlsx`);
      showToast('File Excel 3 Sheet (BALITA, BUSUI, BUMIL) berhasil diunduh!', 'success');
    }

    function copyMbgTabToClipboard() {
      const tab = appState.laporanMbgTab || 'BALITA';
      const rows = getMbgTabRows(tab);
      if (rows.length === 0) {
        showToast(`Belum ada data di tab ${tab} untuk disalin.`, 'error');
        return;
      }

      const tsv = rows.map(r => r.join('\t')).join('\n');
      const tempArea = document.createElement('textarea');
      tempArea.value = tsv;
      tempArea.style.position = 'fixed';
      tempArea.style.left = '-9999px';
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        showToast(`Berhasil menyalin ${rows.length} baris tab ${tab}! Tinggal Paste (Ctrl+V) di Excel.`, 'success');
      } catch (err) {
        showToast('Gagal menyalin ke clipboard.', 'error');
      }
      document.body.removeChild(tempArea);
    }

    function initKmsChart() {
      const canvas = document.getElementById('kms-growth-chart');
      if (!canvas || typeof Chart === 'undefined') return;
      const riwayat = getMyPemeriksaanList();
      if (riwayat.length === 0) return;

      const labels = riwayat.map(r => formatTanggalIndo(r.tanggalPeriksa));
      const dataBB = riwayat.map(r => r.beratBadan);
      const dataTB = riwayat.map(r => r.tinggiBadan);

      new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Berat Badan (kg)',
              data: dataBB,
              borderColor: '#0d9488',
              backgroundColor: 'rgba(13, 148, 136, 0.15)',
              tension: 0.35,
              fill: true,
              yAxisID: 'y'
            },
            {
              label: 'Tinggi Badan (cm)',
              data: dataTB,
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.1)',
              tension: 0.35,
              fill: false,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Berat (kg)' } },
            y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Tinggi (cm)' } }
          }
        }
      });
    }

        savePeserta(payload, editItem?.id || null);

        // 2. LOGIKA AUTO-CREATE IBU MENYUSUI JIKA ANAK < 2 TAHUN (BADUTA)
        if (kel === 'ANAK' && ibu !== '') {
          const usiaBulan = hitungUsiaBulan(payload.tanggalLahir);
          if (usiaBulan < 24) {
            const nikIbu = payload.nikOrangTua || (payload.nik + '-IBU');
            
            // PENGKONDISIAN: Cek apakah ibu sudah pernah terdaftar (Mencegah Duplikat saat Edit)
            const ibuSudahAda = appState.pesertaList.find(p => p.nik === nikIbu || p.nik === (payload.nik + '-IBU'));
            
            if (!ibuSudahAda) {
              const payloadIbu = {
                kelompokSasaran: 'BUMIL_BUSUI',
                statusAktif: payload.statusAktif,
                nik: nikIbu,
                pin: payload.pin, // PIN disamakan dengan PIN Anak
                namaAnak: ibu, // Menyimpan nama ibu di kolom utama
                tanggalLahir: payload.tanggalLahir, // Tanggal lahir default (bisa diedit manual nanti)
                jenisKelamin: 'P',
                namaAyah: '',
                namaIbu: '',
                namaOrangTua: ayah || 'Keluarga / Suami', // Wali dari ibu adalah ayah/suami
                alamat: payload.alamat,
                penerimaMBG: true, // Otomatis terdaftar terima MBG
                kategoriMBG: 'Ibu Menyusui (Busui)',
                kehamilanKe: '',
                hpht: '',
                hpl: '',
                namaAnakTerkait: payload.namaAnak,
                nikAnakTerkait: payload.nik,
                statusGiziTerakhir: 'Normal'
              };
              
              // Beri jeda 0.5 detik sebelum menyimpan profil ibu agar tidak bentrok dengan data anak
              setTimeout(() => {
                savePeserta(payloadIbu, null);
              }, 500);
            }
          }
        }
      };
    }

          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
            <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl text-slate-600 font-semibold hover:bg-slate-100">Batal</button>
            <button type="submit" id="btn-submit-import" class="px-5 py-2 rounded-xl bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Mulai Import</button>
          </div>
        </form>
      `);

      document.getElementById('btn-download-template-peserta').onclick = downloadTemplateImportPeserta;
      document.getElementById('btn-close-modal').onclick = closeModal;

      // Baca file Excel saat user memilih file
      document.getElementById('inp-import-excel-file').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        const statusEl = document.getElementById('lbl-excel-file-status');
        if (!file) {
          parsedExcelRows = null;
          statusEl.classList.add('hidden');
          return;
        }
        if (typeof XLSX === 'undefined') {
          showToast('Library pembaca Excel belum dimuat.', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = new Uint8Array(ev.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
            // Lewati baris header jika kolom pertama berisi kata 'NIK' atau 'NO'
            const startIdx = (aoa.length > 0 && /nik|nama/i.test(String(aoa[0][0] || ''))) ? 1 : 0;
            parsedExcelRows = aoa.slice(startIdx).filter(r => r.some(cell => String(cell).trim() !== ''));
            statusEl.textContent = `✅ File terbaca: ${parsedExcelRows.length} baris data siap di-import.`;
            statusEl.classList.remove('hidden');
          } catch (err) {
            parsedExcelRows = null;
            showToast('Gagal membaca file Excel: ' + err.message, 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      });

      document.getElementById('form-import-peserta').onsubmit = async (e) => {
        e.preventDefault();
        const rawData = document.getElementById('inp-import-data').value.trim();
        const isMbg = document.getElementById('chk-import-mbg').checked;
        const autoBusui = document.getElementById('chk-import-busui').checked;
        const btnSubmit = document.getElementById('btn-submit-import');

        // Ambil baris dari Upload File Excel atau dari Textarea Copy-Paste
        let rowsToProcess = [];
        if (parsedExcelRows && parsedExcelRows.length > 0) {
          rowsToProcess = parsedExcelRows;
        } else if (rawData) {
          rowsToProcess = rawData.split('\n').filter(r => r.trim()).map(r => r.split('\t').map(c => c.trim()));
        } else {
          showToast('Silakan upload file Excel atau paste baris data terlebih dahulu.', 'error');
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Memproses...';
        showToast('Memulai import ' + rowsToProcess.length + ' baris data. Mohon tunggu...', 'info');

        let successCount = 0;
        let ibuCount = 0;

        for (const cols of rowsToProcess) {
          if (cols.length >= 6) {
            const nik = String(cols[0] || '').trim();
            const namaAnak = String(cols[1] || '').trim();
            if (!nik || !namaAnak) continue;

            const jk = String(cols[2] || 'L').trim().toUpperCase() === 'P' ? 'P' : 'L';
            const tglLahirYmd = convertDateExcel(cols[3]);
            const ayah = String(cols[4] || '').trim();
            const ibu = String(cols[5] || '').trim();
            const alamat = String(cols[6] || '').trim();
            const nikOrangTua = String(cols[7] || '').trim();

            let ortu = '-';
            if (ayah && ibu) ortu = `${ayah} / ${ibu}`;
            else if (ayah) ortu = ayah;
            else if (ibu) ortu = ibu;

            const defaultPin = '123456';
            let kategoriMBG = '-';
            if (isMbg) {
              const usiaBln = hitungUsiaBulan(tglLahirYmd);
              kategoriMBG = usiaBln < 24 ? 'Baduta (< 2 Tahun)' : 'Balita (2–5 Tahun)';
            }

            const payloadAnak = {
              kelompokSasaran: 'ANAK',
              statusAktif: 'Aktif',
              nik: nik,
              pin: defaultPin,
              namaAnak: namaAnak,
              tanggalLahir: tglLahirYmd,
              jenisKelamin: jk,
              namaAyah: ayah,
              namaIbu: ibu,
              namaOrangTua: ortu,
              nikOrangTua: nikOrangTua,
              alamat: alamat,
              penerimaMBG: isMbg,
              kategoriMBG: kategoriMBG,
              kehamilanKe: '',
              hpht: '',
              hpl: '',
              statusGiziTerakhir: 'Normal'
            };

            await savePeserta(payloadAnak, null, true);
            successCount++;

            if (autoBusui && ibu !== '') {
              const usiaBln = hitungUsiaBulan(tglLahirYmd);
              if (usiaBln < 24) {
                const nikIbu = nikOrangTua || (nik + '-IBU');
                const ibuSudahAda = appState.pesertaList.find(p => p.nik === nikIbu || p.nik === (nik + '-IBU'));
                if (!ibuSudahAda) {
                  const payloadIbu = {
                    kelompokSasaran: 'BUMIL_BUSUI',
                    statusAktif: 'Aktif',
                    nik: nikIbu,
                    pin: defaultPin,
                    namaAnak: ibu,
                    tanggalLahir: tglLahirYmd,
                    jenisKelamin: 'P',
                    namaAyah: '',
                    namaIbu: '',
                    namaOrangTua: ayah || 'Keluarga / Suami',
                    alamat: alamat,
                    penerimaMBG: isMbg,
                    kategoriMBG: 'Ibu Menyusui (Busui)',
                    kehamilanKe: '',
                    hpht: '',
                    hpl: '',
                    namaAnakTerkait: namaAnak,
                    nikAnakTerkait: nik,
                    statusGiziTerakhir: 'Normal'
                  };
                  await savePeserta(payloadIbu, null, true);
                  ibuCount++;
                }
              }
            }
          }
        }

        closeModal();
        renderApp();
        showToast(`Berhasil import: ${successCount} Anak & ${ibuCount} Profil Ibu.`, 'success');
      };
    }

    function initSuratTugasSignaturePad() {
      const canvas = document.getElementById('st-signature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const cy = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
      };

      const startDraw = (e) => {
        e.preventDefault();
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#002060';
      };

      const moveDraw = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (drawing) {
          drawing = false;
          ctx.closePath();
        }
      };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);

      document.getElementById('btn-st-clear-sig')?.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveGlobalSignature('');
      });

      document.getElementById('btn-st-apply-sig')?.addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        appState.suratTugas.signatureDataUrl = dataUrl;
        const img = document.getElementById('st-view-sig-img');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang sementara ke surat.', 'success');
      });

      document.getElementById('btn-st-save-default-sig')?.addEventListener('click', () => {
        const dataUrl = appState.suratTugas.signatureDataUrl || canvas.toDataURL('image/png');
        saveGlobalSignature(dataUrl);
      });
    }

    function initReportSignaturePad() {
      const canvas = document.getElementById('rep-signature-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let drawing = false;

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
        const cy = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
      };

      const startDraw = (e) => {
        e.preventDefault();
        drawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#002060';
      };

      const moveDraw = (e) => {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      };

      const endDraw = () => {
        if (drawing) {
          drawing = false;
          ctx.closePath();
        }
      };

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', endDraw);
      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      window.addEventListener('touchend', endDraw);

      document.getElementById('btn-rep-clear-sig')?.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveGlobalSignature('');
      });

      document.getElementById('btn-rep-apply-sig')?.addEventListener('click', () => {
        const dataUrl = canvas.toDataURL('image/png');
        appState.reportSignatureDataUrl = dataUrl;
        const img = document.getElementById('rep-view-sig-img');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang sementara ke laporan.', 'success');
      });

      document.getElementById('btn-rep-save-default-sig')?.addEventListener('click', () => {
        const dataUrl = appState.reportSignatureDataUrl || canvas.toDataURL('image/png');
        saveGlobalSignature(dataUrl);
      });
    }

    function downloadSuratTugasDocx() {
      const paperEl = document.getElementById('surat-tugas-paper-doc');
      if (!paperEl) return;
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Surat Tugas</title><style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;}table{border-collapse:collapse;width:100%;}</style></head><body>";
      const footer = "</body></html>";
      const fullDoc = header + paperEl.innerHTML + footer;

      const blob = new Blob(['\ufeff' + fullDoc], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Surat_Tugas_${appState.suratTugas.namaPosyandu.replace(/\s+/g, '_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

        return;

        else if (appState.activeTab === 'peserta') mainContent = renderAdminPeserta();
        else if (appState.activeTab === 'pemeriksaan') mainContent = renderAdminPemeriksaan();
        else if (appState.activeTab === 'mbg') mainContent = renderAdminMBG();
        else if (appState.activeTab === 'laporan_mbg') mainContent = renderAdminLaporanMBG();
        else if (appState.activeTab === 'jadwal') mainContent = renderAdminJadwal();
        else if (appState.activeTab === 'artikel') mainContent = renderAdminArtikel();
        else if (appState.activeTab === 'galeri') mainContent = renderAdminGaleri();
        else if (appState.activeTab === 'kader') mainContent = renderAdminKader();
        else if (appState.activeTab === 'surattugas') mainContent = renderAdminSuratTugas();
        else if (appState.activeTab === 'laporan') mainContent = renderAdminLaporan();

        <div class="min-h-screen bg-slate-50/70">
          ${renderNavigation()}
          <main class="main-content-area px-4 sm:px-8 pt-6 max-w-6xl">
            ${mainContent}
