    // =========================================================================

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button class="text-white/80 hover:text-white font-bold text-lg leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('custom-modal-backdrop');
      const box = document.getElementById('custom-modal-box');

      backdrop.classList.remove('hidden');

    function closeModal() {

    }

    function confirmDialog(title, message, onConfirm) {
      openModal(`
        <div class="flex items-start gap-3">

          <div class="flex-1">

          <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 transition shadow-sm">Ya, Hapus</button>
        </div>
      `);
      document.getElementById('modal-cancel-btn').onclick = closeModal;
      document.getElementById('modal-confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function formatTanggalSuratFull(dateStr) {
      if (!dateStr) return '';
      const bulanFull = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const tgl = parseInt(parts[2], 10);
      const bln = bulanFull[parseInt(parts[1], 10) - 1] || '';
      return `${tgl < 10 ? '0' + tgl : tgl} ${bln} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    function hitungUsiaTahun(tglLahirStr) {
      return Math.floor(hitungUsiaBulan(tglLahirStr) / 12);
    }

    function getKlasifikasiSasaran(peserta) {
      const kel = peserta.kelompokSasaran || 'ANAK';
      if (kel === 'LANSIA') {
        return { kode: 'LANSIA', label: 'Lansia', badgeClass: 'bg-purple-100 text-purple-800' };
      }
      if (kel === 'BUMIL_BUSUI') {
        return { kode: 'BUMIL_BUSUI', label: 'Ibu Hamil / Menyusui', badgeClass: 'bg-pink-100 text-pink-800' };
      }
      const usiaBln = hitungUsiaBulan(peserta.tanggalLahir);
      if (usiaBln < 24) {
        return { kode: 'BADUTA', label: 'Baduta (< 2 Thn)', badgeClass: 'bg-sky-100 text-sky-800' };
      }
      return { kode: 'BALITA', label: 'Balita (2–5 Thn)', badgeClass: 'bg-indigo-100 text-indigo-800' };
    }

    async function handleUserLogin(nik, pin) {
      const cleanNik = nik.trim();
      const cleanPin = pin.trim();

      if (!cleanNik || !cleanPin) {
        showToast('NIK dan PIN wajib diisi.', 'error');
        return;
      }

      if (IS_PREVIEW) {
        const found = appState.pesertaList.find(p => p.nik === cleanNik && p.pin === cleanPin);
        if (found) {
          appState.role = 'user';
          appState.currentUser = found;
          appState.activeTab = 'beranda';
          showToast(`Selamat datang, ${found.namaAnak}!`, 'success');
          renderApp();
        } else {
          showToast('NIK atau PIN peserta tidak ditemukan.', 'error');
        }
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const q = query(
          collection(db, 'peserta'),
          where('nik', '==', cleanNik),
          where('pin', '==', cleanPin)
        );
        const snap = await getDocs(q);
        appState.loading = false;

        if (snap.empty) {
          showToast('NIK atau PIN tidak sesuai. Hubungi Kader Posyandu.', 'error');
          renderApp();
          return;
        }

        const docPeserta = snap.docs[0];
        const userData = { id: docPeserta.id, ...docPeserta.data() };
        if (userData.statusAktif === 'Non-Aktif') {
          showToast('Status kepesertaan Anda saat ini Non-Aktif.', 'error');
          renderApp();
          return;
        }

        appState.role = 'user';
        appState.currentUser = userData;
        appState.activeTab = 'beranda';
        startUserRealtimeSync(userData.id, userData.nik);
        showToast(`Selamat datang, ${userData.namaAnak}!`, 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Kesalahan saat memverifikasi akun: ' + err.message, 'error');
        renderApp();
      }
    }

    function compressLogoImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 260;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/png', 0.9));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Artikel</label>
            <input type="text" name="judul" required value="${escapeHtml(editItem?.judul || '')}" placeholder="Judul artikel kesehatan..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 outline-none font-semibold" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
              <input type="text" name="kategori" required value="${escapeHtml(editItem?.kategori || 'Gizi & Kesehatan')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Publikasi</label>
              <input type="date" name="tanggal" required value="${escapeHtml(editItem?.tanggal || todayStr)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Ringkasan / Sinopsis (Tampil di Depan)</label>
            <textarea name="ringkasan" rows="2" required placeholder="Ringkasan singkat artikel..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 outline-none text-xs">${escapeHtml(editItem?.ringkasan || '')}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Isi Lengkap Artikel (Blogger Post)</label>
            <textarea name="isiKonten" rows="5" required placeholder="Tulis isi artikel secara lengkap di sini..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 outline-none text-xs">${escapeHtml(editItem?.isiKonten || '')}</textarea>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-slate-600 font-semibold hover:bg-slate-100">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-teal-600 text-white font-semibold hover:bg-teal-700">Publikasikan</button>
          </div>
        </form>
      `);

      document.getElementById('modal-form-artikel').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
          judul: fd.get('judul').trim(),
          kategori: fd.get('kategori').trim(),
          tanggal: fd.get('tanggal'),
          penulis: 'Kader Posyandu Nusa Indah XX',
          ringkasan: fd.get('ringkasan').trim(),
          isiKonten: fd.get('isiKonten').trim()
        };
        closeModal();
        saveArtikel(payload, editItem?.id || null);
      };
    }

    // =========================================================================
    // RENDER UTAMA & BINDING
    // =========================================================================
    function renderApp() {
      const mount = document.getElementById('app-mount');

      if (!appState.role) {
        if (appState.showLoginView) {
          mount.innerHTML = renderLoginScreen();
        } else {
          mount.innerHTML = renderLandingPage();
        }
        bindLoginEvents();
        return;
      }

      let mainContent = '';
      if (appState.role === 'admin') {
        if (appState.activeTab === 'dashboard') mainContent = renderAdminDashboard();
        else if (appState.activeTab === 'peserta') mainContent = renderAdminPeserta();
        else if (appState.activeTab === 'pemeriksaan') mainContent = renderAdminPemeriksaan();
        else if (appState.activeTab === 'mbg') mainContent = renderAdminMBG();
        else if (appState.activeTab === 'kader') mainContent = renderAdminKader();
        else if (appState.activeTab === 'surattugas') mainContent = renderAdminSuratTugas();
        else if (appState.activeTab === 'laporan') mainContent = renderAdminLaporan();
        else if (appState.activeTab === 'jadwal') mainContent = renderAdminJadwal();
        else if (appState.activeTab === 'artikel') mainContent = renderAdminArtikel();
      } else {
        if (appState.activeTab === 'beranda') mainContent = renderUserBeranda();
        else if (appState.activeTab === 'kms') mainContent = renderUserKMS();
      }

      mount.innerHTML = `
        <div class="min-h-screen bg-slate-50/70">
          ${renderNavigation()}
          <main class="main-content-area px-4 sm:px-8 pt-6 max-w-6xl">
            ${mainContent}
          </main>
        </div>
      `;

      bindAuthenticatedEvents();

      if (appState.role === 'user' && appState.activeTab === 'kms') {
        initKmsChart();
      }
      if (appState.role === 'admin' && appState.activeTab === 'surattugas') {
        initSuratTugasSignaturePad();
      }
      if (appState.role === 'admin' && appState.activeTab === 'laporan') {
        initReportSignaturePad();
      }
    }

    function bindLoginEvents() {
      document.getElementById('btn-show-login')?.addEventListener('click', () => {
        appState.showLoginView = true;
        renderApp();
      });
      document.getElementById('btn-show-login-from-art')?.addEventListener('click', () => {
        appState.selectedArtikel = null;
        appState.showLoginView = true;
        renderApp();
      });

      document.getElementById('btn-back-to-home')?.addEventListener('click', () => {
        appState.selectedArtikel = null;
        renderApp();
      });

      document.getElementById('btn-back-landing')?.addEventListener('click', () => {
        appState.showLoginView = false;
        renderApp();
      });

      document.getElementById('tab-login-user')?.addEventListener('click', () => {
        appState.loginTab = 'user';
        renderApp();
      });

      document.getElementById('tab-login-admin')?.addEventListener('click', () => {
        appState.loginTab = 'admin';
        renderApp();
      });

      document.getElementById('btn-toggle-pin')?.addEventListener('click', () => {
        appState.showLoginPassword = !appState.showLoginPassword;
        renderApp();
      });

      document.getElementById('btn-toggle-pass')?.addEventListener('click', () => {
        appState.showLoginPassword = !appState.showLoginPassword;
        renderApp();
      });

      document.querySelectorAll('[data-artikel-id]').forEach(card => {
        card.addEventListener('click', () => {
          const artId = card.getAttribute('data-artikel-id');
          const found = appState.artikelList.find(a => a.id === artId);
          if (found) {
            appState.selectedArtikel = found;
            renderApp();
          }
        });
      });

      document.getElementById('form-login-user')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const nik = document.getElementById('input-user-nik').value;
        const pin = document.getElementById('input-user-pin').value;
        handleUserLogin(nik, pin);
      });

      document.getElementById('form-login-admin')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('input-admin-email').value;
        const pass = document.getElementById('input-admin-pass').value;
        handleAdminLogin(email, pass);
      });
    }

    function bindAuthenticatedEvents() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeTab = btn.getAttribute('data-nav');
          renderApp();
        });
      });

      document.getElementById('btn-logout-desktop')?.addEventListener('click', handleLogout);
      document.getElementById('btn-logout-mobile')?.addEventListener('click', handleLogout);

      document.getElementById('btn-add-peserta')?.addEventListener('click', () => openPesertaFormModal());

      const searchInput = document.getElementById('search-peserta-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          appState.searchQuery = e.target.value;
          renderApp();
          const newInput = document.getElementById('search-peserta-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        });
      }

      document.getElementById('filter-sasaran-select')?.addEventListener('change', (e) => {
        appState.filterSasaran = e.target.value;
        renderApp();
      });

      document.getElementById('filter-status-aktif-select')?.addEventListener('change', (e) => {
        appState.filterStatusAktif = e.target.value;
        renderApp();
      });

      document.getElementById('filter-mbg-select')?.addEventListener('change', (e) => {
        appState.filterMbg = e.target.value;
        renderApp();
      });

      document.querySelectorAll('[data-edit-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-peserta');
          const item = appState.pesertaList.find(p => p.id === id);
          if (item) openPesertaFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-peserta');
          confirmDialog('Hapus Data Peserta?', 'Data peserta ini akan dihapus permanen.', () => deletePeserta(id));
        });
      });

      document.getElementById('btn-add-kader')?.addEventListener('click', () => openKaderFormModal());

      document.querySelectorAll('[data-edit-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-kader');
          const item = appState.kaderList.find(k => k.id === id);
          if (item) openKaderFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-kader');
          confirmDialog('Hapus Data Kader?', 'Data kader ini akan dihapus.', () => deleteKader(id));
        });
      });

      // Artikel / Berita events
      document.getElementById('btn-add-artikel')?.addEventListener('click', () => openArtikelFormModal());

      document.querySelectorAll('[data-edit-artikel]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-artikel');
          const item = appState.artikelList.find(a => a.id === id);
          if (item) openArtikelFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-artikel]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-artikel');
          confirmDialog('Hapus Artikel?', 'Artikel ini akan dihapus dari portal berita.', () => deleteArtikel(id));
        });
      });
    }

    // =========================================================================
    // BOOTSTRAP APLIKASI
    // =========================================================================
    if (!IS_PREVIEW && auth) {
      loadPublicData();
      startPublicRealtimeSync();
      onAuthStateChanged(auth, (user) => {
        if (user && appState.role !== 'admin') {
          appState.role = 'admin';
          appState.currentUser = { uid: user.uid, email: user.email };
          appState.activeTab = 'dashboard';
          startAdminRealtimeSync();
        }
        renderApp();
      });
    } else {
      renderApp();
    }
  </script>
</body>
</html>
