    // =========================================================================
    // UTILITAS UI (TOAST, MODAL, FORMAT TANGGAL, HITUNG USIA & KLASIFIKASI)
    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 transform translate-y-0 opacity-100`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button class="text-white/80 hover:text-white font-bold text-lg leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('custom-modal-backdrop');
      const box = document.getElementById('custom-modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('custom-modal-backdrop');
      backdrop.classList.add('hidden');
    }

    function confirmDialog(title, message, onConfirm) {
      openModal(`
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center shrink-0 font-bold">!</div>
          <div class="flex-1">
            <h3 class="text-lg font-bold text-slate-900">${escapeHtml(title)}</h3>
            <p class="text-sm text-slate-600 mt-1">${escapeHtml(message)}</p>
          </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Batal</button>
          <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 transition shadow-sm">Ya, Hapus</button>
        </div>
      `);
      document.getElementById('modal-cancel-btn').onclick = closeModal;
      document.getElementById('modal-confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function formatTanggalLengkap(dateStr) {
      if (!dateStr) return '-';
      const bulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const tgl = parseInt(parts[2], 10);
      return `${tgl < 10 ? '0' + tgl : tgl} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    function hitungUsiaTahun(tglLahirStr) {
      return Math.floor(hitungUsiaBulan(tglLahirStr) / 12);
    }

    // Klasifikasi Otomatis Sasaran: BADUTA (< 24 bln), BALITA (24-59 bln), BUMIL_BUSUI, LANSIA
    function getKlasifikasiPeserta(p) {
      const jenis = p?.jenisSasaran || 'Anak';
      if (jenis === 'Ibu Hamil' || jenis === 'Ibu Menyusui') {
        return {
          code: 'BUMIL_BUSUI',
          label: jenis,
          badgeClass: 'bg-pink-50 text-pink-700 border-pink-200'
        };
      }
      if (jenis === 'Lansia') {
        return {
          code: 'LANSIA',
          label: `Lansia (${hitungUsiaTahun(p.tanggalLahir)} Thn)`,
          badgeClass: 'bg-purple-50 text-purple-700 border-purple-200'
        };
      }
      const usiaBln = hitungUsiaBulan(p.tanggalLahir);
      if (usiaBln < 24) {
        return {
          code: 'BADUTA',
          label: `Baduta (${usiaBln} Bln)`,
          badgeClass: 'bg-sky-50 text-sky-700 border-sky-200'
        };
      }
      return {
        code: 'BALITA',
        label: `Balita (${usiaBln} Bln)`,
        badgeClass: 'bg-indigo-50 text-indigo-700 border-indigo-200'
      };
    }

    function getStatusBadge(status) {
      if (status === 'Normal') {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Normal / Baik</span>`;
      } else if (status === 'Gizi Kurang') {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">Gizi Kurang</span>`;
      } else {
        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">Perlu Pantauan</span>`;
      }
    }

    async function handleUserLogin(nik, pin) {
      const cleanNik = nik.trim();
      const cleanPin = pin.trim();

      if (!cleanNik || !cleanPin) {
        showToast('NIK Peserta dan PIN wajib diisi.', 'error');
        return;
      }

      if (IS_PREVIEW) {
        const found = appState.pesertaList.find(p => p.nik === cleanNik && p.pin === cleanPin);
        if (found) {
          appState.role = 'user';
          appState.currentUser = found;
          appState.activeTab = 'beranda';
          showToast(`Selamat datang, ${found.namaAnak}!`, 'success');
          renderApp();
        } else {
          showToast('NIK atau PIN peserta tidak ditemukan dalam data demo.', 'error');
        }
        return;
      }

      if (!db) {
        showToast('Koneksi database Firestore belum tersedia.', 'error');
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const q = query(
          collection(db, 'peserta'),
          where('nik', '==', cleanNik),
          where('pin', '==', cleanPin)
        );
        const snap = await getDocs(q);
        appState.loading = false;

        if (snap.empty) {
          showToast('NIK Peserta atau PIN tidak sesuai. Hubungi Kader Posyandu Nusa Indah XX.', 'error');
          renderApp();
          return;
        }

        const docPeserta = snap.docs[0];
        const userData = { id: docPeserta.id, ...docPeserta.data() };
        appState.role = 'user';
        appState.currentUser = userData;
        appState.activeTab = 'beranda';
        startUserRealtimeSync(userData.id, userData.nik);
        showToast(`Selamat datang, ${userData.namaAnak}!`, 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Terjadi kesalahan saat memverifikasi akun peserta: ' + err.message, 'error');
        renderApp();
      }
    }

    async function handleLogout() {
      clearFirestoreListeners();
      if (!IS_PREVIEW && auth && appState.role === 'admin') {
        try {
          await signOut(auth);

      }
      appState.role = null;

    async function savePeserta(data, editId = null) {
      if (IS_PREVIEW) {
        if (editId) {
          const idx = appState.pesertaList.findIndex(p => p.id === editId);
          if (idx !== -1) appState.pesertaList[idx] = { ...appState.pesertaList[idx], ...data };
          showToast('Data peserta diperbarui (Mode Preview)', 'success');
        } else {
          const exists = appState.pesertaList.some(p => p.nik === data.nik);
          if (exists) {
            showToast('NIK sudah terdaftar!', 'error');
            return;
          }
          appState.pesertaList.unshift({ id: 'dummy-' + Date.now(), ...data });
          showToast('Peserta baru ditambahkan (Mode Preview)', 'success');
        }
        renderApp();
        return;
      }

      try {
        if (editId) {
          await updateDoc(doc(db, 'peserta', editId), data);
          showToast('Data peserta berhasil diperbarui.', 'success');
        } else {
          await addDoc(collection(db, 'peserta'), {
            ...data,
            createdAt: serverTimestamp()
          });
          showToast('Peserta baru berhasil didaftarkan.', 'success');
        }
      } catch (err) {
        showToast('Gagal menyimpan data peserta: ' + err.message, 'error');
      }
    }

          noHp: fd.get('noHp').trim(),

    function downloadSuratTugasWord() {
      const paperEl = document.getElementById('paperDoc');
      if (!paperEl) return;
      const paperHtml = paperEl.innerHTML;
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Surat Tugas</title><style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;}table{border-collapse:collapse;width:100%;}</style></head><body>";
      const footer = "</body></html>";
      const fullDoc = header + paperHtml + footer;

      const blob = new Blob(['\ufeff' + fullDoc], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Surat_Tugas_${appState.suratTugas.namaPosyandu.replace(/\s+/g, '_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function initSuratTugasCanvasAndEvents() {
      const canvas = document.getElementById('st-signature-canvas');
      let ctx = null;
      let isDrawing = false;
      let hasDrawn = false;

      if (canvas) {
        ctx = canvas.getContext('2d');
        const getCoords = (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
          const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
          return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        };

        const startDraw = (e) => {
          e.preventDefault();
          isDrawing = true;
          hasDrawn = true;
          const pos = getCoords(e);
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#002060';
        };
        const moveDraw = (e) => {
          if (!isDrawing) return;
          e.preventDefault();
          const pos = getCoords(e);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        };
        const endDraw = () => {
          if (isDrawing) {
            isDrawing = false;
            ctx.closePath();
          }
        };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw);
      }

      document.getElementById('btn-st-sig-clear')?.addEventListener('click', () => {
        if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasDrawn = false;
        appState.suratTugas.signatureDataUrl = '';
        const img = document.getElementById('imgSignature');
        if (img) {
          img.src = '';
          img.style.display = 'none';
        }
      });

      document.getElementById('btn-st-sig-apply')?.addEventListener('click', () => {
        if (!canvas || !hasDrawn) {
          showToast('Silakan goreskan tanda tangan terlebih dahulu pada kotak.', 'info');
          return;
        }
        const dataUrl = canvas.toDataURL('image/png');
        appState.suratTugas.signatureDataUrl = dataUrl;
        const img = document.getElementById('imgSignature');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang ke surat.', 'success');
      });

      document.getElementById('st-sig-upload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.suratTugas.signatureDataUrl = ev.target.result;
          const img = document.getElementById('imgSignature');
          if (img) {
            img.src = ev.target.result;
            img.style.display = 'block';
          }
          showToast('Gambar tanda tangan / cap berhasil dipasang.', 'success');
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('st-logo-upload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.suratTugas.logoDataUrl = ev.target.result;
          const container = document.getElementById('kopLogoContainer');
          if (container) {
            container.innerHTML = `<img src="${ev.target.result}" alt="Logo Posyandu" style="width:100%; height:100%; object-fit:contain; border-radius:50%;">`;
          }
          showToast('Logo kop surat berhasil diperbarui.', 'success');
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('btn-st-logo-reset')?.addEventListener('click', () => {
        appState.suratTugas.logoDataUrl = '';
        const container = document.getElementById('kopLogoContainer');
        if (container) container.innerHTML = defaultSvgLogoHtml;
        showToast('Logo dikembalikan ke default Posyandu.', 'info');
      });

      document.querySelectorAll('.st-input').forEach(el => {
        const eventType = el.type === 'date' ? 'change' : 'input';
        el.addEventListener(eventType, (e) => {
          const field = e.target.getAttribute('data-st-field');
          appState.suratTugas[field] = e.target.value;
          updateSuratTugasLiveDom();
        });
      });

      document.querySelectorAll('.st-kader-input').forEach(el => {
        el.addEventListener('input', (e) => {
          const idx = parseInt(e.target.getAttribute('data-st-kader-idx'), 10);
          const key = e.target.getAttribute('data-st-kader-key');
          appState.suratTugas.kaderAssigned[idx][key] = e.target.value;
          updateSuratTugasLiveDom();
        });
      });

      document.getElementById('btn-st-add-kader')?.addEventListener('click', () => {
        appState.suratTugas.kaderAssigned.push({ nama: '', jabatan: 'Kader' });
        renderApp();
      });

      document.querySelectorAll('[data-st-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-st-del-kader'), 10);
          if (appState.suratTugas.kaderAssigned.length > 1) {
            appState.suratTugas.kaderAssigned.splice(idx, 1);
            renderApp();
          }
        });
      });

      document.getElementById('btn-insert-kader-db')?.addEventListener('click', () => {
        const sel = document.getElementById('select-pick-kader-db');
        if (!sel || sel.value === '') return;
        const kd = appState.kaderList[parseInt(sel.value, 10)];
        if (!kd) return;
        const list = appState.suratTugas.kaderAssigned;
        if (list.length === 1 && (!list[0].nama || list[0].nama === 'Ismayawati')) {
          list[0] = { nama: kd.nama, jabatan: kd.jabatan || 'Kader' };
        } else {
          list.push({ nama: kd.nama, jabatan: kd.jabatan || 'Kader' });
        }
        renderApp();
      });

      document.getElementById('btn-st-tab-form')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'form';
        renderApp();
      });

      document.getElementById('btn-st-tab-preview')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'preview';
        renderApp();
      });

      document.getElementById('btn-st-pdf')?.addEventListener('click', () => {
        if (window.innerWidth < 1024 && appState.suratTugas.mobileView === 'form') {
          appState.suratTugas.mobileView = 'preview';
          renderApp();
          setTimeout(() => window.print(), 200);
        } else {
          window.print();
        }
      });

      document.getElementById('btn-st-word')?.addEventListener('click', downloadSuratTugasWord);
    }

    function renderAdminLaporan() {
      const isMonthly = appState.reportType === 'monthly';
      const periodPrefix = isMonthly ? appState.reportMonth : appState.reportYear;

      const namaBulanIndo = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];

      let labelPeriode = '';
      if (isMonthly && appState.reportMonth) {
        const [yr, mo] = appState.reportMonth.split('-');
        labelPeriode = `Bulan ${namaBulanIndo[parseInt(mo, 10) - 1] || mo} Tahun ${yr}`;
      } else {
        labelPeriode = `Tahun ${appState.reportYear}`;
      }

      const mapPesertaByNik = {};
      appState.pesertaList.forEach(p => { mapPesertaByNik[p.nik] = p; });

      const matchKelompokFilter = (nik, fallbackKelompok = '') => {
        if (appState.reportKelompok === 'ALL') return true;
        const p = mapPesertaByNik[nik];
        if (p) return getKlasifikasiPeserta(p).code === appState.reportKelompok;
        return fallbackKelompok === appState.reportKelompok;
      };

      const filteredPeriksa = appState.pemeriksaanList
        .filter(k => (k.tanggalPeriksa || '').startsWith(periodPrefix) && matchKelompokFilter(k.nik, k.kodeKelompok))
        .sort((a, b) => (a.tanggalPeriksa || '').localeCompare(b.tanggalPeriksa || ''));

      const filteredMBG = appState.mbgList
        .filter(m => (m.tanggalDistribusi || '').startsWith(periodPrefix) && matchKelompokFilter(m.nik, m.kodeKelompok))
        .sort((a, b) => (a.tanggalDistribusi || '').localeCompare(b.tanggalDistribusi || ''));

      const showPeriksa = appState.reportCategory === 'semua' || appState.reportCategory === 'pemeriksaan';
      const showMBG = appState.reportCategory === 'semua' || appState.reportCategory === 'mbg';

      const labelKelompokMap = {

    function initKmsChart() {
      const canvas = document.getElementById('kms-growth-chart');
      if (!canvas || typeof Chart === 'undefined') return;
      const riwayat = getMyPemeriksaanList();
      if (riwayat.length === 0) return;

      const labels = riwayat.map(r => `${r.usiaBulan} Bln (${formatTanggalIndo(r.tanggalPeriksa)})`);
      const dataBB = riwayat.map(r => r.beratBadan);
      const dataTB = riwayat.map(r => r.tinggiBadan);

      new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Berat Badan (kg)',
              data: dataBB,
              borderColor: '#0d9488',
              backgroundColor: 'rgba(13, 148, 136, 0.15)',
              tension: 0.35,
              fill: true,
              yAxisID: 'y'
            },
            {
              label: 'Tinggi Badan (cm)',
              data: dataTB,
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.1)',
              tension: 0.35,
              fill: false,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              title: { display: true, text: 'Berat (kg)' }
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              grid: { drawOnChartArea: false },
              title: { display: true, text: 'Tinggi (cm)' }
            }
          }
        }
      });
    }

      document.getElementById('btn-close-modal').onclick = closeModal;
      document.getElementById('modal-form-mbg').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const pesertaId = fd.get('pesertaId');
        const peserta = appState.pesertaList.find(p => p.id === pesertaId);
        const klas = getKlasifikasiPeserta(peserta);

        const payload = {
          pesertaId,
          nik: peserta.nik,
          namaAnak: peserta.namaAnak,
          namaOrangTua: peserta.namaOrangTua,
          kodeKelompok: klas.code,
          kelompokSasaran: klas.label,
          kategoriMBG: peserta.kategoriMBG && peserta.kategoriMBG !== '-' ? peserta.kategoriMBG : klas.label,
          tanggalDistribusi: fd.get('tanggalDistribusi'),
          menuPaket: fd.get('menuPaket').trim(),

    function openPemeriksaanFormModal() {
      const pesertaAktif = appState.pesertaList.filter(p => (p.statusAktif || 'Aktif') === 'Aktif');
      if (pesertaAktif.length === 0) {
        showToast('Tambahkan data peserta aktif terlebih dahulu sebelum menginput pemeriksaan.', 'error');
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      openModal(`
        <h3 class="text-lg font-bold text-slate-900 mb-4">Input Hasil Pemeriksaan & Pemantauan</h3>
        <form id="modal-form-pemeriksaan" class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Peserta Aktif</label>
            <select name="pesertaId" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
              ${pesertaAktif.map(p => {
                const klas = getKlasifikasiPeserta(p);
                return `<option value="${p.id}">${escapeHtml(p.namaAnak)} [${escapeHtml(klas.label)}] - NIK: ${escapeHtml(p.nik)}</option>`;
              }).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Periksa</label>
              <input type="date" name="tanggalPeriksa" required value="${todayStr}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Status Kesehatan / Gizi</label>
              <select name="statusGizi" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
                <option value="Normal">Normal / Baik</option>
                <option value="Perlu Pantauan">Perlu Pantauan (KEK / Tensi / BB)</option>
                <option value="Gizi Kurang">Gizi Kurang / Risiko Tinggi</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Berat (kg)</label>
              <input type="number" step="0.1" name="beratBadan" required placeholder="10.5" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tinggi (cm)</label>
              <input type="number" step="0.1" name="tinggiBadan" required placeholder="82.0" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">LK / LILA (cm)</label>
              <input type="number" step="0.1" name="lingkarKepala" placeholder="46.5 / 24.5" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Imunisasi / Tensi / Usia Hamil</label>
              <input type="text" name="imunisasi" placeholder="Polio 3 / TD 120/80 / UK 24 mgg" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Vitamin / Suplemen / Obat</label>
              <select name="vitamin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">
                <option value="-">Tidak Ada</option>
                <option value="Vitamin A Biru (6-11 Bln)">Vitamin A Biru</option>
                <option value="Vitamin A Merah (1-5 Thn)">Vitamin A Merah</option>
                <option value="Tablet Tambah Darah (TTD)">Tablet Tambah Darah (Bumil)</option>
                <option value="Vitamin Lansia / Kalsium">Vitamin Lansia / Kalsium</option>
                <option value="Obat Cacing">Obat Cacing</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Catatan / Saran Kader</label>
            <textarea name="catatan" rows="2" placeholder="Catatan perkembangan anak, kehamilan, atau kondisi lansia..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl text-slate-600 font-semibold hover:bg-slate-100">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-teal-600 text-white font-semibold hover:bg-teal-700">Simpan Pemeriksaan</button>
          </div>
        </form>
      `);

      document.getElementById('btn-close-modal').onclick = closeModal;
      document.getElementById('modal-form-pemeriksaan').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const pesertaId = fd.get('pesertaId');
        const peserta = appState.pesertaList.find(p => p.id === pesertaId);
        const tglPeriksa = fd.get('tanggalPeriksa');
        const klas = getKlasifikasiPeserta(peserta);

        const payload = {
          pesertaId,
          nik: peserta.nik,
          namaAnak: peserta.namaAnak,
          kodeKelompok: klas.code,
          kelompokSasaran: klas.label,
          tanggalPeriksa: tglPeriksa,
          usiaBulan: hitungUsiaBulan(peserta.tanggalLahir, tglPeriksa),
          beratBadan: parseFloat(fd.get('beratBadan')),
          tinggiBadan: parseFloat(fd.get('tinggiBadan')),
          lingkarKepala: parseFloat(fd.get('lingkarKepala')) || 0,
          imunisasi: fd.get('imunisasi').trim() || '-',
          vitamin: fd.get('vitamin'),
          statusGizi: fd.get('statusGizi'),
          catatan: fd.get('catatan').trim()
        };
        closeModal();
        savePemeriksaan(payload);
      };
    }

    function openJadwalFormModal(editItem = null) {
      openModal(`
        <h3 class="text-lg font-bold text-slate-900 mb-4">${editItem ? 'Edit Jadwal Posyandu' : 'Tambah Jadwal Posyandu'}</h3>
        <form id="modal-form-jadwal" class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Judul Kegiatan</label>
            <input type="text" name="judul" required value="${escapeHtml(editItem?.judul || '')}" placeholder="Contoh: Posyandu Rutin Bulan Ini" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
              <input type="date" name="tanggal" required value="${escapeHtml(editItem?.tanggal || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Waktu</label>
              <input type="text" name="waktu" required value="${escapeHtml(editItem?.waktu || '08:00 - 11:00 WIB')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi Kegiatan</label>
            <input type="text" name="lokasi" required value="${escapeHtml(editItem?.lokasi || 'Balai Warga RW 20 / Posyandu Nusa Indah XX')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan / Pengumuman</label>
            <textarea name="keterangan" rows="3" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-teal-500 outline-none">${escapeHtml(editItem?.keterangan || '')}</textarea>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="btn-close-modal" class="px-4 py-2 rounded-xl text-slate-600 font-semibold hover:bg-slate-100">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-teal-600 text-white font-semibold hover:bg-teal-700">Simpan Jadwal</button>
          </div>
        </form>
      `);

      document.getElementById('btn-close-modal').onclick = closeModal;
      document.getElementById('modal-form-jadwal').onsubmit = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = {
          judul: fd.get('judul').trim(),
          tanggal: fd.get('tanggal'),
          waktu: fd.get('waktu').trim(),
          lokasi: fd.get('lokasi').trim(),
          keterangan: fd.get('keterangan').trim()
        };
        closeModal();
        saveJadwal(payload, editItem?.id || null);
      };
    }

    // =========================================================================
    // MAIN RENDERER & EVENT BINDING
    // =========================================================================
    function renderApp() {
      const mount = document.getElementById('app-mount');

      if (!appState.role) {
        mount.innerHTML = renderLoginScreen();
        bindLoginEvents();
        return;
      }

      let mainContent = '';
      if (appState.role === 'admin') {
        if (appState.activeTab === 'dashboard') mainContent = renderAdminDashboard();
        else if (appState.activeTab === 'peserta') mainContent = renderAdminPeserta();
        else if (appState.activeTab === 'pemeriksaan') mainContent = renderAdminPemeriksaan();
        else if (appState.activeTab === 'mbg') mainContent = renderAdminMBG();
        else if (appState.activeTab === 'kader') mainContent = renderAdminKader();
        else if (appState.activeTab === 'surattugas') mainContent = renderAdminSuratTugas();
        else if (appState.activeTab === 'laporan') mainContent = renderAdminLaporan();
        else if (appState.activeTab === 'jadwal') mainContent = renderAdminJadwal();
      } else {
        if (appState.activeTab === 'beranda') mainContent = renderUserBeranda();
        else if (appState.activeTab === 'kms') mainContent = renderUserKMS();
      }

      mount.innerHTML = `
        <div class="min-h-screen bg-slate-50/70">
          ${renderNavigation()}

          <main class="main-content-area px-4 sm:px-8 pt-6 max-w-6xl">
            ${IS_PREVIEW ? `
              <div class="no-print mb-5 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-2.5 flex items-center justify-between gap-2 text-xs text-amber-900">
                <span><strong>Mode Preview Aktif:</strong> Perubahan data hanya tersimpan sementara di memori browser.</span>
                <span class="px-2 py-0.5 rounded bg-amber-500 text-white font-bold shrink-0">PREVIEW</span>
              </div>
            ` : ''}

            ${mainContent}
          </main>
        </div>
      `;

      bindAuthenticatedEvents();

      if (appState.role === 'admin' && appState.activeTab === 'surattugas') {
        initSuratTugasCanvasAndEvents();
      }

      if (appState.role === 'user' && appState.activeTab === 'kms') {
        initKmsChart();
      }
    }

    function bindLoginEvents() {
      document.getElementById('tab-login-user')?.addEventListener('click', () => {
        appState.loginTab = 'user';
        renderApp();
      });

      document.getElementById('tab-login-admin')?.addEventListener('click', () => {
        appState.loginTab = 'admin';
        renderApp();
      });

      document.getElementById('form-login-user')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const nik = document.getElementById('input-user-nik').value;
        const pin = document.getElementById('input-user-pin').value;
        handleUserLogin(nik, pin);
      });

      document.getElementById('form-login-admin')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('input-admin-email').value;
        const pass = document.getElementById('input-admin-pass').value;
        handleAdminLogin(email, pass);
      });
    }

    function bindAuthenticatedEvents() {
      // Navigation buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeTab = btn.getAttribute('data-nav');
          renderApp();
        });
      });

      // Logout buttons
      document.getElementById('btn-logout-desktop')?.addEventListener('click', handleLogout);
      document.getElementById('btn-logout-mobile')?.addEventListener('click', handleLogout);

      // Admin Peserta actions
      document.getElementById('btn-add-peserta')?.addEventListener('click', () => openPesertaFormModal());

      const searchInput = document.getElementById('search-peserta-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          appState.searchQuery = e.target.value;
          renderApp();
          const newInput = document.getElementById('search-peserta-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        });
      }

      document.querySelectorAll('[data-edit-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-peserta');
          const item = appState.pesertaList.find(p => p.id === id);
          if (item) openPesertaFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-peserta]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-peserta');
          confirmDialog('Hapus Data Peserta?', 'Data balita ini akan dihapus permanen dari daftar.', () => deletePeserta(id));
        });
      });

      document.getElementById('filter-mbg-select')?.addEventListener('change', (e) => {
        appState.filterMbg = e.target.value;
        renderApp();
      });

      document.getElementById('filter-kelompok-select')?.addEventListener('change', (e) => {
        appState.filterKelompok = e.target.value;
        renderApp();
      });

      document.getElementById('filter-status-aktif-select')?.addEventListener('change', (e) => {
        appState.filterStatusAktif = e.target.value;
        renderApp();
      });

      document.querySelectorAll('.quick-kelompok-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-quick-kelompok');
          appState.filterKelompok = appState.filterKelompok === val ? 'ALL' : val;
          renderApp();
        });
      });

      // Admin MBG actions
      document.getElementById('btn-add-mbg')?.addEventListener('click', () => openMBGFormModal());

      document.querySelectorAll('[data-del-mbg]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-mbg');
          confirmDialog('Hapus Catatan MBG?', 'Riwayat penyaluran paket MBG ini akan dihapus.', () => deleteDistribusiMBG(id));
        });
      });

      // Admin Kader actions
      document.getElementById('btn-add-kader')?.addEventListener('click', () => openKaderFormModal());

      document.querySelectorAll('[data-edit-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-kader');
          const item = appState.kaderList.find(k => k.id === id);
          if (item) openKaderFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-kader');
          confirmDialog('Hapus Data Kader?', 'Data kader posyandu ini akan dihapus.', () => deleteKader(id));
        });
      });

      // Admin Laporan PDF actions
      document.getElementById('btn-trigger-print-pdf')?.addEventListener('click', () => {
        window.print();
      });

      document.getElementById('select-report-type')?.addEventListener('change', (e) => {
        appState.reportType = e.target.value;
        renderApp();
      });

      document.getElementById('input-report-month')?.addEventListener('change', (e) => {
        appState.reportMonth = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-year')?.addEventListener('change', (e) => {
        appState.reportYear = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-category')?.addEventListener('change', (e) => {
        appState.reportCategory = e.target.value;
        renderApp();
      });

      document.getElementById('select-report-kelompok')?.addEventListener('change', (e) => {
        appState.reportKelompok = e.target.value;
        renderApp();
      });

      // Admin Pemeriksaan actions
      document.getElementById('btn-add-pemeriksaan')?.addEventListener('click', () => openPemeriksaanFormModal());

      document.querySelectorAll('[data-del-pemeriksaan]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-pemeriksaan');
          confirmDialog('Hapus Catatan Pemeriksaan?', 'Riwayat penimbangan ini akan dihapus.', () => deletePemeriksaan(id));
        });
      });

      // Admin Jadwal actions
      document.getElementById('btn-add-jadwal')?.addEventListener('click', () => openJadwalFormModal());

      document.querySelectorAll('[data-edit-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-edit-jadwal');
          const item = appState.jadwalList.find(j => j.id === id);
          if (item) openJadwalFormModal(item);
        });
      });

      document.querySelectorAll('[data-del-jadwal]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-jadwal');
          confirmDialog('Hapus Jadwal?', 'Pengumuman jadwal kegiatan ini akan dihapus.', () => deleteJadwal(id));
        });
      });
    }

    // =========================================================================
    // BOOTSTRAP APLIKASI SAAT HALAMAN DIMUAT
    // =========================================================================
    if (!IS_PREVIEW && auth) {
      onAuthStateChanged(auth, (user) => {
        if (user && appState.role !== 'admin') {
          appState.role = 'admin';
          appState.currentUser = { uid: user.uid, email: user.email };
          appState.activeTab = 'dashboard';
          startAdminRealtimeSync();
        }
        renderApp();
      });
    } else {
      renderApp();
    }
  </script>
</body>

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-teal-600 text-white border-teal-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-white border-slate-700'
      };
      toast.className = `${colors[type] || colors.info} pointer-events-auto px-4 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 transform translate-y-0 opacity-100`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button class="text-white/80 hover:text-white font-bold text-lg leading-none" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('custom-modal-backdrop');
      const box = document.getElementById('custom-modal-box');
      box.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      const backdrop = document.getElementById('custom-modal-backdrop');
      backdrop.classList.add('hidden');
    }

    function confirmDialog(title, message, onConfirm) {
      openModal(`
        <div class="flex items-start gap-3">

        </div>
        <div class="flex justify-end gap-2 mt-6">
          <button id="modal-cancel-btn" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Batal</button>
          <button id="modal-confirm-btn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-rose-600 text-white hover:bg-rose-700 transition shadow-sm">Ya, Hapus</button>
        </div>
      `);
      document.getElementById('modal-cancel-btn').onclick = closeModal;
      document.getElementById('modal-confirm-btn').onclick = () => {
        closeModal();
        onConfirm();
      };
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTanggalIndo(dateStr) {
      if (!dateStr) return '-';
      const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parseInt(parts[2], 10)} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function formatTanggalLengkap(dateStr) {
      if (!dateStr) return '-';
      const bulan = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const tgl = parseInt(parts[2], 10);
      return `${tgl < 10 ? '0' + tgl : tgl} ${bulan[parseInt(parts[1], 10) - 1]} ${parts[0]}`;
    }

    function hitungUsiaBulan(tglLahirStr, tglRefStr = null) {
      if (!tglLahirStr) return 0;
      const lahir = new Date(tglLahirStr);
      const ref = tglRefStr ? new Date(tglRefStr) : new Date();
      let months = (ref.getFullYear() - lahir.getFullYear()) * 12;
      months -= lahir.getMonth();
      months += ref.getMonth();
      if (ref.getDate() < lahir.getDate()) months--;
      return Math.max(0, months);
    }

    function getStatusBadge(status) {

        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">Gizi Kurang</span>`;

        return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">Perlu Pantauan</span>`;
      }
    }

      });

      // Pantau riwayat penerimaan MBG milik peserta ini
      const qMbg = query(collection(db, 'distribusi_mbg'), where('nik', '==', nik));
      const unsubMbg = onSnapshot(qMbg, (snapshot) => {
        appState.mbgList = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.tanggalDistribusi || '').localeCompare(a.tanggalDistribusi || ''));
        renderApp();
      });

      unsubscribers.push(unsubProfil, unsubPeriksa, unsubJadwal, unsubMbg);
    }

      try {

    async function handleUserLogin(nik, pin) {
      const cleanNik = nik.trim();
      const cleanPin = pin.trim();

      if (!cleanNik || !cleanPin) {
        showToast('NIK Anak dan PIN wajib diisi.', 'error');
        return;
      }

      if (IS_PREVIEW) {
        const found = appState.pesertaList.find(p => p.nik === cleanNik && p.pin === cleanPin);
        if (found) {
          appState.role = 'user';
          appState.currentUser = found;
          appState.activeTab = 'beranda';
          showToast(`Selamat datang, Bunda/Ayah dari ${found.namaAnak}!`, 'success');
          renderApp();
        } else {
          showToast('NIK atau PIN peserta tidak ditemukan dalam data demo.', 'error');
        }
        return;
      }

      if (!db) {
        showToast('Koneksi database Firestore belum tersedia.', 'error');
        return;
      }

      try {
        appState.loading = true;
        renderApp();
        const q = query(
          collection(db, 'peserta'),
          where('nik', '==', cleanNik),
          where('pin', '==', cleanPin)
        );
        const snap = await getDocs(q);
        appState.loading = false;

        if (snap.empty) {
          showToast('NIK Anak atau PIN tidak sesuai. Hubungi Kader Posyandu Nusa Indah XX.', 'error');
          renderApp();
          return;
        }

        const docPeserta = snap.docs[0];
        const userData = { id: docPeserta.id, ...docPeserta.data() };
        appState.role = 'user';
        appState.currentUser = userData;
        appState.activeTab = 'beranda';
        startUserRealtimeSync(userData.id, userData.nik);
        showToast(`Selamat datang, Orang Tua dari ${userData.namaAnak}!`, 'success');
        renderApp();
      } catch (err) {
        appState.loading = false;
        showToast('Terjadi kesalahan saat memverifikasi akun peserta: ' + err.message, 'error');
        renderApp();
      }
    }

    async function handleLogout() {
      clearFirestoreListeners();
      if (!IS_PREVIEW && auth && appState.role === 'admin') {
        try {
          await signOut(auth);
        } catch (e) {}
      }
      appState.role = null;
      appState.currentUser = null;
      appState.searchQuery = '';
      if (!IS_PREVIEW) {
        appState.pesertaList = [];
        appState.pemeriksaanList = [];
        appState.mbgList = [];
        appState.kaderList = [];
        appState.jadwalList = [];
      }
      showToast('Anda telah keluar dari sesi.', 'info');
      renderApp();
    }

    async function savePeserta(data, editId = null) {
      if (IS_PREVIEW) {
        if (editId) {
          const idx = appState.pesertaList.findIndex(p => p.id === editId);
          if (idx !== -1) appState.pesertaList[idx] = { ...appState.pesertaList[idx], ...data };
          showToast('Data peserta diperbarui (Mode Preview)', 'success');
        } else {
          const exists = appState.pesertaList.some(p => p.nik === data.nik);
          if (exists) {
            showToast('NIK sudah terdaftar!', 'error');
            return;
          }
          appState.pesertaList.unshift({ id: 'dummy-' + Date.now(), ...data });
          showToast('Peserta baru ditambahkan (Mode Preview)', 'success');
        }
        renderApp();
        return;
      }

      try {
        if (editId) {
          await updateDoc(doc(db, 'peserta', editId), data);
          showToast('Data peserta berhasil diperbarui.', 'success');
        } else {
          await addDoc(collection(db, 'peserta'), {
            ...data,
            createdAt: serverTimestamp()
          });
          showToast('Peserta baru berhasil didaftarkan.', 'success');
        }
      } catch (err) {
        showToast('Gagal menyimpan data peserta: ' + err.message, 'error');
      }
    }

    function downloadSuratTugasWord() {
      const paperEl = document.getElementById('paperDoc');
      if (!paperEl) return;
      const paperHtml = paperEl.innerHTML;
      const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Surat Tugas</title><style>body{font-family:'Times New Roman',serif;font-size:12pt;line-height:1.5;}table{border-collapse:collapse;width:100%;}</style></head><body>";
      const footer = "</body></html>";
      const fullDoc = header + paperHtml + footer;

      const blob = new Blob(['\ufeff' + fullDoc], { type: 'application/msword' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `Surat_Tugas_${appState.suratTugas.namaPosyandu.replace(/\s+/g, '_')}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function initSuratTugasCanvasAndEvents() {
      const canvas = document.getElementById('st-signature-canvas');
      let ctx = null;
      let isDrawing = false;
      let hasDrawn = false;

      if (canvas) {
        ctx = canvas.getContext('2d');
        const getCoords = (e) => {
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
          const clientY = (e.touches && e.touches.length > 0) ? e.touches[0].clientY : e.clientY;
          return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        };

        const startDraw = (e) => {
          e.preventDefault();
          isDrawing = true;
          hasDrawn = true;
          const pos = getCoords(e);
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = '#002060';
        };
        const moveDraw = (e) => {
          if (!isDrawing) return;
          e.preventDefault();
          const pos = getCoords(e);
          ctx.lineTo(pos.x, pos.y);
          ctx.stroke();
        };
        const endDraw = () => {
          if (isDrawing) {
            isDrawing = false;
            ctx.closePath();
          }
        };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        canvas.addEventListener('touchstart', startDraw, { passive: false });
        canvas.addEventListener('touchmove', moveDraw, { passive: false });
        canvas.addEventListener('touchend', endDraw);
      }

      document.getElementById('btn-st-sig-clear')?.addEventListener('click', () => {
        if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasDrawn = false;
        appState.suratTugas.signatureDataUrl = '';
        const img = document.getElementById('imgSignature');
        if (img) {
          img.src = '';
          img.style.display = 'none';
        }
      });

      document.getElementById('btn-st-sig-apply')?.addEventListener('click', () => {
        if (!canvas || !hasDrawn) {
          showToast('Silakan goreskan tanda tangan terlebih dahulu pada kotak.', 'info');
          return;
        }
        const dataUrl = canvas.toDataURL('image/png');
        appState.suratTugas.signatureDataUrl = dataUrl;
        const img = document.getElementById('imgSignature');
        if (img) {
          img.src = dataUrl;
          img.style.display = 'block';
        }
        showToast('Tanda tangan digital dipasang ke surat.', 'success');
      });

      document.getElementById('st-sig-upload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.suratTugas.signatureDataUrl = ev.target.result;
          const img = document.getElementById('imgSignature');
          if (img) {
            img.src = ev.target.result;
            img.style.display = 'block';
          }
          showToast('Gambar tanda tangan / cap berhasil dipasang.', 'success');
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('st-logo-upload')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          appState.suratTugas.logoDataUrl = ev.target.result;
          const container = document.getElementById('kopLogoContainer');
          if (container) {
            container.innerHTML = `<img src="${ev.target.result}" alt="Logo Posyandu" style="width:100%; height:100%; object-fit:contain; border-radius:50%;">`;
          }
          showToast('Logo kop surat berhasil diperbarui.', 'success');
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('btn-st-logo-reset')?.addEventListener('click', () => {
        appState.suratTugas.logoDataUrl = '';
        const container = document.getElementById('kopLogoContainer');
        if (container) container.innerHTML = defaultSvgLogoHtml;
        showToast('Logo dikembalikan ke default Posyandu.', 'info');
      });

      document.querySelectorAll('.st-input').forEach(el => {
        const eventType = el.type === 'date' ? 'change' : 'input';
        el.addEventListener(eventType, (e) => {
          const field = e.target.getAttribute('data-st-field');
          appState.suratTugas[field] = e.target.value;
          updateSuratTugasLiveDom();
        });
      });

      document.querySelectorAll('.st-kader-input').forEach(el => {
        el.addEventListener('input', (e) => {
          const idx = parseInt(e.target.getAttribute('data-st-kader-idx'), 10);
          const key = e.target.getAttribute('data-st-kader-key');
          appState.suratTugas.kaderAssigned[idx][key] = e.target.value;
          updateSuratTugasLiveDom();
        });
      });

      document.getElementById('btn-st-add-kader')?.addEventListener('click', () => {
        appState.suratTugas.kaderAssigned.push({ nama: '', jabatan: 'Kader' });
        renderApp();
      });

      document.querySelectorAll('[data-st-del-kader]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-st-del-kader'), 10);
          if (appState.suratTugas.kaderAssigned.length > 1) {
            appState.suratTugas.kaderAssigned.splice(idx, 1);
            renderApp();
          }
        });
      });

      document.getElementById('btn-insert-kader-db')?.addEventListener('click', () => {
        const sel = document.getElementById('select-pick-kader-db');
        if (!sel || sel.value === '') return;
        const kd = appState.kaderList[parseInt(sel.value, 10)];
        if (!kd) return;
        const list = appState.suratTugas.kaderAssigned;
        if (list.length === 1 && (!list[0].nama || list[0].nama === 'Ismayawati')) {
          list[0] = { nama: kd.nama, jabatan: kd.jabatan || 'Kader' };
        } else {
          list.push({ nama: kd.nama, jabatan: kd.jabatan || 'Kader' });
        }
        renderApp();
      });

      document.getElementById('btn-st-tab-form')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'form';
        renderApp();
      });

      document.getElementById('btn-st-tab-preview')?.addEventListener('click', () => {
        appState.suratTugas.mobileView = 'preview';
        renderApp();
      });

      document.getElementById('btn-st-pdf')?.addEventListener('click', () => {
        if (window.innerWidth < 1024 && appState.suratTugas.mobileView === 'form') {
          appState.suratTugas.mobileView = 'preview';
          renderApp();
          setTimeout(() => window.print(), 200);
        } else {
          window.print();
        }
      });

      document.getElementById('btn-st-word')?.addEventListener('click', downloadSuratTugasWord);
    }

    function initKmsChart() {
      const canvas = document.getElementById('kms-growth-chart');
      if (!canvas || typeof Chart === 'undefined') return;
      const riwayat = getMyPemeriksaanList();
      if (riwayat.length === 0) return;

      const labels = riwayat.map(r => `${r.usiaBulan} Bln (${formatTanggalIndo(r.tanggalPeriksa)})`);
      const dataBB = riwayat.map(r => r.beratBadan);
      const dataTB = riwayat.map(r => r.tinggiBadan);

      new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Berat Badan (kg)',
              data: dataBB,
              borderColor: '#0d9488',
              backgroundColor: 'rgba(13, 148, 136, 0.15)',
              tension: 0.35,
              fill: true,
              yAxisID: 'y'
            },
            {
              label: 'Tinggi Badan (cm)',
              data: dataTB,
              borderColor: '#6366f1',
              backgroundColor: 'rgba(99, 102, 241, 0.1)',
              tension: 0.35,
              fill: false,
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              title: { display: true, text: 'Berat (kg)' }
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              grid: { drawOnChartArea: false },
              title: { display: true, text: 'Tinggi (cm)' }
            }
          }
        }
      });
    }
